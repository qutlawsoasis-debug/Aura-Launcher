plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

apply from: "../aura-glass-common/common.gradle"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    exclude 'net/auramc/glass/client/mixin/qa/**'
    exclude 'aura-glass-qa.client.mixins.json'
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/aura-glass.accesswidener")
    runs {
        if (project.hasProperty("aura.karaokeDemo") && project.property("aura.karaokeDemo").toString() == "true") {
            client {
                property "aura.karaoke.demo", "true"
                property "aura.qa.headless", "true"
                property "aura.qa.versionSuffix", "120"
                property "aura.qa.proofDir", file("../../frames").absolutePath
                runDir "../../run/120"
            }
        } else if (project.hasProperty("aura.layoutTour") && project.property("aura.layoutTour").toString() == "true") {
            client {
                property "aura.qa.headless", "true"
                property "aura.qa.layoutTour", "true"
                property "aura.qa.proofDir", file("../../frames-w3e/1.20.1").absolutePath
                property "aura.qa.versionSuffix", "120"
            }
        }
        karaokeDemo {
            client()
            runDir "../../run/120"
            property "aura.karaoke.demo", "true"
            property "aura.qa.headless", "true"
            property "aura.qa.versionSuffix", "120"
            property "aura.qa.proofDir", file("../../frames").absolutePath
        }
        layoutTour {
            client()
            runDir "../../run/120"
            property "aura.qa.headless", "true"
            property "aura.qa.layoutTour", "true"
            property "aura.qa.proofDir", file("../../frames-w3e/1.20.1").absolutePath
            property "aura.qa.versionSuffix", "120"
        }
    }
}

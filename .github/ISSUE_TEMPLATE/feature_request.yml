name: 💡 Feature Request
description: Propose a new feature, improvement, or idea for Aura Launcher
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Aura Launcher even better? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
      placeholder: I'm always frustrated when...
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you considered.

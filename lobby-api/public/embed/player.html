<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Aura Embed Player</title>
<style>
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
#player { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="player"></div>
<script>
const params = new URLSearchParams(location.search);
const channel = params.get('channel');
let parentOrigin = null;
try {
  const url = new URL(params.get('parentOrigin'));
  const loopback = ['127.0.0.1', 'localhost', '[::1]'].includes(url.hostname);
  if (url.origin === params.get('parentOrigin') &&
      ((url.protocol === 'http:' && loopback) || url.origin === location.origin)) {
    parentOrigin = url.origin;
  }
} catch {}
let yt = null;
let ready = false;
let videoId = null;
let timer = null;

function notify(message) {
  if (parentOrigin && channel) {
    window.parent.postMessage({ source: 'aura-yt-embed', channel, ...message }, parentOrigin);
  }
}
function progress() {
  if (!ready) return;
  notify({
    event: 'timeUpdate',
    videoId,
    currentTime: yt.getCurrentTime() || 0,
    duration: yt.getDuration() || 0
  });
}
window.onYouTubeIframeAPIReady = function() {
  if (!parentOrigin || !channel) return;
  const frame = document.createElement('iframe');
  const query = new URLSearchParams({
    enablejsapi: '1', autoplay: '0', controls: '0', disablekb: '1',
    fs: '0', rel: '0', playsinline: '1',
    origin: location.origin, widget_referrer: location.origin
  });
  frame.id = 'player';
  frame.src = 'https://www.youtube.com/embed/?' + query;
  frame.allow = 'autoplay; encrypted-media; fullscreen';
  frame.referrerPolicy = 'strict-origin-when-cross-origin';
  document.getElementById('player').replaceWith(frame);
  yt = new YT.Player(frame, {
    events: {
      onReady: () => {
        ready = true;
        notify({ event: 'ready' });
        timer = setInterval(progress, 250);
      },
      onStateChange: (event) => {
        notify({ event: 'stateChange', state: event.data, videoId });
        progress();
      },
      onError: (event) => notify({ event: 'error', code: event.data, videoId }),
      onAutoplayBlocked: () => notify({ event: 'autoplayBlocked', videoId })
    }
  });
};
window.addEventListener('message', (event) => {
  const data = event.data;
  if (!parentOrigin || event.source !== window.parent || event.origin !== parentOrigin ||
      !data || data.source !== 'aura-yt-host' || data.channel !== channel || !ready) return;
  try {
    switch (data.op) {
      case 'load':
      case 'cue':
        if (typeof data.videoId !== 'string' || !/^[a-zA-Z0-9_-]{11}$/.test(data.videoId)) return;
        videoId = data.videoId;
        const options = { videoId, startSeconds: Number.isFinite(data.startSeconds) ? Math.max(0, data.startSeconds) : 0 };
        if (data.op === 'load') yt.loadVideoById(options);
        else yt.cueVideoById(options);
        break;
      case 'play': yt.playVideo(); break;
      case 'pause': yt.pauseVideo(); break;
      case 'stop': yt.stopVideo(); break;
      case 'seek':
        if (Number.isFinite(data.seconds)) yt.seekTo(Math.max(0, data.seconds), true);
        break;
      case 'volume':
        if (Number.isFinite(data.value)) yt.setVolume(Math.max(0, Math.min(100, data.value)));
        break;
      case 'ping': notify({ event: 'ready' }); break;
    }
  } catch {
    notify({ event: 'unavailable', videoId });
  }
});
window.addEventListener('pagehide', () => clearInterval(timer));
if (parentOrigin && channel && window.parent !== window) {
  const api = document.createElement('script');
  api.src = 'https://www.youtube.com/iframe_api';
  api.onerror = () => notify({ event: 'unavailable' });
  document.head.appendChild(api);
}
</script>
</body>
</html>

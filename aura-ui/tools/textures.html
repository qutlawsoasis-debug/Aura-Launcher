<!doctype html>
<!-- Текстуры для кинематографичного экрана загрузки Aura по концепту docs/redesign/game/loading.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Onest';
    src: url('../../docs/redesign/v3/public/assets/fonts/Onest.woff2') format('woff2');
    font-weight: 100 900;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: 'Onest', sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .shot {
    position: absolute;
    left: 0;
    display: inline-block;
  }

  /* 1. Крупный вордмарк AURA: Onest 800, градиент со свечением */
  #wordmark {
    top: 0;
    font-size: 88px;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #FFFFFF;
    line-height: 1;
    padding: 20px 30px;
    background: linear-gradient(120deg, #FFFFFF 0%, #FFFFFF 38%, #64D2FF 48%, #FFFFFF 58%, #FFFFFF 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 24px rgba(100, 210, 255, 0.45));
  }

  /* 1b. Маска букв вордмарка: точно такой же размер и отступы, сплошной белый цвет без тени */
  #wordmark_mask {
    top: 0;
    font-size: 88px;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #FFFFFF;
    line-height: 1;
    padding: 20px 30px;
    background: transparent;
    -webkit-text-fill-color: #FFFFFF;
    filter: none;
  }

  /* 2. Подзаголовок: СЕРВЕР ДРУЗЕЙ */
  #subtitle {
    top: 150px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #64D2FF;
    padding: 6px 14px;
    line-height: 1;
    opacity: 0.95;
    text-shadow: 0 0 12px rgba(100, 210, 255, 0.4);
  }

  /* 4. Метка статуса с точкой слева: • Загрузка */
  #label {
    top: 360px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #FFFFFF;
    padding: 6px 12px;
    line-height: 1;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #64D2FF;
    box-shadow: 0 0 8px #64D2FF;
  }

  /* 5. Подсказки tip1..tip4 */
  .tip {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.55);
    padding: 6px 14px;
    line-height: 1;
  }
  #tip1 { top: 410px; }
  #tip2 { top: 450px; }
  #tip3 { top: 490px; }
  #tip4 { top: 530px; }

  /* 6. Виньетка: затемнение по краям и снизу, центр прозрачный */
  #vignette {
    top: 580px;
    width: 960px;
    height: 540px;
    background: radial-gradient(circle at 50% 48%, rgba(8, 11, 18, 0) 35%, rgba(8, 11, 18, 0.5) 75%, rgba(8, 11, 18, 0.85) 100%),
                linear-gradient(180deg, rgba(8, 11, 18, 0.35) 0%, rgba(8, 11, 18, 0) 25%, rgba(8, 11, 18, 0) 70%, rgba(8, 11, 18, 0.8) 100%);
  }
</style>
</head>
<body>
  <div class="shot" id="wordmark">Aura</div>
  <div class="shot" id="wordmark_mask">Aura</div>
  <div class="shot" id="subtitle">Сервер друзей</div>
  <div class="shot" id="label"><span class="dot"></span><span>Загрузка</span></div>
  <div class="shot tip" id="tip1">Подсказка: клавиша F3+T быстро перезагружает текстуры прямо в игре</div>
  <div class="shot tip" id="tip2">Совет: в лобби лаунчера можно позвать друга нажатием одной кнопки</div>
  <div class="shot tip" id="tip3">Гардероб: обновляйте скины и плащи прямо из лаунчера</div>
  <div class="shot tip" id="tip4">Друзья онлайн: подключайтесь к мирам друзей в один клик</div>
  <div class="shot" id="vignette"></div>
</body>
</html>

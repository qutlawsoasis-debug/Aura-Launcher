plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // NanoVG via LWJGL 3.3.1 (Minecraft 1.20.1 uses LWJGL 3.3.1)
    implementation "org.lwjgl:lwjgl-nanovg:3.3.1"
    include "org.lwjgl:lwjgl-nanovg:3.3.1"

    implementation "org.lwjgl:lwjgl-nanovg:3.3.1:natives-windows"
    include "org.lwjgl:lwjgl-nanovg:3.3.1:natives-windows"

    implementation "org.lwjgl:lwjgl-nanovg:3.3.1:natives-linux"
    include "org.lwjgl:lwjgl-nanovg:3.3.1:natives-linux"

    implementation "org.lwjgl:lwjgl-nanovg:3.3.1:natives-macos"
    include "org.lwjgl:lwjgl-nanovg:3.3.1:natives-macos"

    implementation "org.lwjgl:lwjgl-nanovg:3.3.1:natives-macos-arm64"
    include "org.lwjgl:lwjgl-nanovg:3.3.1:natives-macos-arm64"

    // Прототип HTML-меню (-Daura.html=true): MCEF не обязателен, в jar не вшивается
    modCompileOnly files("libs/mcef-fabric-2.1.6-1.20.1.jar")
    modLocalRuntime files("libs/mcef-fabric-2.1.6-1.20.1.jar")
}

tasks.register('syncWeb', Copy) {
    into layout.projectDirectory.dir("src/main/resources/assets/aura-ui/web")

    from("../docs/redesign/ingame") {
        include "index.html"
        include "lucide.min.js"
    }

    from("../docs/redesign/v3/public/assets/fonts") {
        include "Onest.woff2"
        into "fonts"
    }

    from("../docs/redesign/v3/public/assets/images") {
        include "bg_1.jpg", "bg_2.jpg", "bg_5.jpg", "bg_6.jpg", "bg_7.jpg",
                "bg_9.jpg", "bg_11.jpg", "bg_12.jpg", "bg_13.jpg", "bg_14.jpg",
                "bg_15.jpg", "Coock0ld.png"
        into "images"
    }
}

processResources {
    dependsOn syncWeb
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

loom {
    runs {
        client {
            programArgs "--quickPlaySingleplayer", "TestWorld"
            if (project.hasProperty("auraHtml")) {
                vmArgs "-Daura.html=${project.property('auraHtml')}", "-Daura.html.autoshot=${project.findProperty('auraShot') ?: 'false'}"
                programArgs "--width", "1920", "--height", "1080"
            }
        }
    }
}

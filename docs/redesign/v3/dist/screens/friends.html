<div style="display:flex;gap:10px">
  <div class="seg" style="flex:1" data-seg="friends" id="friendsSegmented">
    <span class="lens"></span>
    <button type="button" class="on" data-tab="all">Все</button>
    <button type="button" data-tab="game">В игре</button>
    <button type="button" data-tab="online">В сети</button>
  </div>
  <button type="button" class="btn" data-reveal="addBox">Добавить</button>
</div>

<div class="reveal" id="addBox">
  <div>
    <div style="display:flex;gap:10px;padding-top:12px">
      <input class="field" id="inputFriendCode" placeholder="Код друга, например AURA-5491-MC88">
      <button type="button" class="btn primary" id="btnSubmitAddFriend">Отправить</button>
    </div>
  </div>
</div>

<div class="group-title" id="requestsTitle">Заявки · 2</div>
<div id="friendRequestsList">
  <div class="person" data-request-id="req-1">
    <div class="face"></div>
    <div style="flex:1">
      <div class="name">RedstonePro</div>
      <div class="small dim">хочет добавить вас</div>
    </div>
    <button type="button" class="btn sm primary btn-accept-req">Принять</button>
    <button type="button" class="btn sm ghost btn-reject-req" aria-label="Отклонить">✕</button>
  </div>
  <div class="person" data-request-id="req-2">
    <div class="face"></div>
    <div style="flex:1">
      <div class="name">AuraPioneer</div>
      <div class="small dim">хочет добавить вас</div>
    </div>
    <button type="button" class="btn sm primary btn-accept-req">Принять</button>
    <button type="button" class="btn sm ghost btn-reject-req" aria-label="Отклонить">✕</button>
  </div>
</div>

<div class="group-title">Список</div>
<div id="friendList">
  <div class="person" data-st="game">
    <div class="face"></div>
    <div style="flex:1">
      <div class="name">zxcursed</div>
      <div class="small dim">В игре · мир Coock0ld</div>
    </div>
    <span class="status"></span>
  </div>
  <div class="person" data-st="game">
    <div class="face"></div>
    <div style="flex:1">
      <div class="name">Nekto</div>
      <div class="small dim">В игре · мир Coock0ld</div>
    </div>
    <span class="status"></span>
  </div>
  <div class="person" data-st="online">
    <div class="face"></div>
    <div style="flex:1">
      <div class="name">Steve_Miner</div>
      <div class="small dim">В лаунчере</div>
    </div>
    <button type="button" class="btn sm btn-invite-friend" data-cmd="friends.invite">Позвать</button>
    <span class="status idle"></span>
  </div>
  <div class="person" data-st="off">
    <div class="face"></div>
    <div style="flex:1">
      <div class="name">Lumi</div>
      <div class="small dim">Был 2 ч назад</div>
    </div>
    <span class="status off"></span>
  </div>
  <div class="person" data-st="off">
    <div class="face"></div>
    <div style="flex:1">
      <div class="name">Frost</div>
      <div class="small dim">Был вчера</div>
    </div>
    <span class="status off"></span>
  </div>
</div>

<div class="row" style="border:0">
  <span class="small muted">Ваш код: <b style="color:#fff" id="myFriendCodeDisplay">AURA-7821-X9M2</b></span>
  <button type="button" class="btn sm" id="btnCopyMyFriendCode" data-copy>Копировать</button>
</div>

<div class="mapwrap">
  <canvas id="mapCanvas"></canvas>
  <div class="coords" id="coords">X 0 · Z 0</div>
  <div class="map-list">
    <button type="button" class="person" data-poi="0"><div class="face" style="--s:34px"></div><div style="flex:1"><div class="name">Вы</div><div class="small dim">Дом у озера</div></div></button>
    <button type="button" class="person" data-poi="1"><div class="face" style="--s:34px"></div><div style="flex:1"><div class="name">zxcursed</div><div class="small dim">Шахта</div></div><span class="status"></span></button>
    <button type="button" class="person" data-poi="2"><div style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700">S</div><div style="flex:1"><div class="name">Спавн</div></div></button>
  </div>
  <div class="map-zoom">
    <button type="button" id="zin" aria-label="Приблизить">+</button>
    <button type="button" id="zout" aria-label="Отдалить">−</button>
  </div>
</div>

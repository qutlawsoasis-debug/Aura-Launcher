<div class="seg" data-seg="workshop" id="workshopSegmented">
  <span class="lens"></span>
  <button type="button" class="on" data-tab="shaders">Шейдеры</button>
  <button type="button" data-tab="mods">Моды · 15</button>
</div>

<div data-pane="shaders" id="paneShaders" style="margin-top:6px">
  <button type="button" class="pick on" data-shader="complementary">
    <span class="radio"></span>
    <span>
      <b>Complementary Reimagined</b>
      <span class="small dim">Выбор Aura · нужна хорошая видеокарта</span>
    </span>
  </button>
  <button type="button" class="pick" data-shader="sildurs">
    <span class="radio"></span>
    <span>
      <b>Sildurs Enhanced Default</b>
      <span class="small dim">Лёгкие шейдеры</span>
    </span>
  </button>
  <button type="button" class="pick" data-shader="builders">
    <span class="radio"></span>
    <span>
      <b>Builders QoL</b>
      <span class="small dim">Максимум FPS</span>
    </span>
  </button>
  <button type="button" class="pick" data-shader="none">
    <span class="radio"></span>
    <span>
      <b>Без шейдеров</b>
      <span class="small dim">Vanilla</span>
    </span>
  </button>
</div>

<div data-pane="mods" id="paneMods" style="margin-top:6px" hidden>
  <div class="row">
    <span>Sodium<span class="hint">Оптимизация видеоядра</span></span>
    <span class="toggle on" data-mod="sodium"></span>
  </div>
  <div class="row">
    <span>Iris Shaders<span class="hint">Графика и шейдеры</span></span>
    <span class="toggle on" data-mod="iris"></span>
  </div>
  <div class="row">
    <span>Distant Horizons<span class="hint">Сверхдальний рендеринг чанков</span></span>
    <span class="toggle on" data-mod="dh"></span>
  </div>
  <div class="row">
    <span>Simple Voice Chat<span class="hint">Голосовой чат по P2P</span></span>
    <span class="toggle on" data-mod="voice"></span>
  </div>
</div>

<div style="display:flex;gap:10px;margin-top:14px">
  <button type="button" class="btn" id="btnSyncMods" data-cmd="pack.sync">Синхронизировать</button>
  <button type="button" class="btn ghost" id="btnOpenModsFolder" data-cmd="fs.openModsFolder">Открыть папку</button>
</div>

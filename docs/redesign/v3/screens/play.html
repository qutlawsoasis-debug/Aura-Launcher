<section class="screen-view is-active" id="screen-play" aria-label="Экран Играть">
  <!-- 1. Правые видоискатели скриншотов (ширина 260px) -->
  <aside class="world-moments-drawer" id="momentsDrawer" data-glass aria-label="Снимки мира">
    <div class="moments-header">
      <div class="moments-title">
        <svg class="icon" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        <span>Снимки мира</span>
      </div>
      <a href="#/workshop" class="moments-link">В Мастерскую →</a>
    </div>

    <!-- Список скриншотов -->
    <div class="moment-card" tabindex="0" role="button" aria-label="Снимок от 13.10.2026 22:40">
      <img class="moment-img" src="assets/images/bg_4.jpg" alt="Скриншот мира от 13.10.2026 22:40">
      <div class="moment-badge">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>13.10.2026 22:40</span>
      </div>
    </div>

    <div class="moment-card" tabindex="0" role="button" aria-label="Снимок от 13.10.2026 20:10">
      <img class="moment-img" src="assets/images/bg_5.jpg" alt="Скриншот мира от 13.10.2026 20:10">
      <div class="moment-badge">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>13.10.2026 20:10</span>
      </div>
    </div>

    <div class="moment-card" tabindex="0" role="button" aria-label="Снимок от 13.10.2026 05:18">
      <img class="moment-img" src="assets/images/bg_6.jpg" alt="Скриншот мира от 13.10.2026 05:18">
      <div class="moment-badge">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>13.10.2026 05:18</span>
      </div>
    </div>

    <!-- Пустое состояние скриншотов -->
    <div class="moments-empty" id="momentsEmpty">
      <div class="moments-empty-icon">
        <svg class="icon" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      </div>
      <div class="moments-empty-text">Нет снимков экрана</div>
      <a href="#/workshop" class="moments-empty-btn">Открыть в Мастерской</a>
    </div>
  </aside>

  <!-- 2. Компактный нижний док (обнимает контент, кнопка Играть сгруппирована рядом) -->
  <footer class="hero-dock" data-glass aria-label="Панель запуска">
    <!-- Профиль игрока -->
    <div class="profile-tile">
      <div class="profile-avatar" title="Coock0ld"></div>
      <div class="profile-info">
        <div class="profile-name">Coock0ld</div>
      </div>
    </div>

    <div class="dock-divider"></div>

    <!-- Спецификации сборки, время и память -->
    <div class="specs-tile">
      <div class="specs-main-line">
        <span id="specsMainText">Minecraft 1.20.1, Fabric 0.19.5, модов: 31</span>
        <button class="changelog-chip" id="btnChangelog" type="button">Список изменений</button>
      </div>
      <div class="specs-sub-line">
        <span id="specsStatsText">В игре: 42 ч. 18 мин. • Запусков: 64</span>
        <span class="specs-dot-sep">•</span>
        <span class="memory-badge">
          <svg class="icon" viewBox="0 0 24 24" style="width: 14px; height: 14px;"><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
          <span>RAM: 6 ГБ</span>
        </span>
      </div>
    </div>

    <div class="dock-divider"></div>

    <!-- Действие запуска: прямо в доке -->
    <div class="launch-btn-box">
      <button class="play-hero-btn state-idle" id="playLaunchBtn" type="button" aria-label="Запустить Minecraft">
        <span class="launch-btn-icon" id="launchBtnIcon">
          <svg class="icon" viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: currentColor;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </span>
        <span class="launch-btn-text" id="launchBtnText">Играть</span>
      </button>
    </div>
  </footer>

  <!-- 3. Отдельный компактный аудиоплеер-виджет -->
  <div class="audio-pill-widget" id="audioPillWidget" data-glass aria-label="Аудиоплеер">
    <img class="audio-art" src="assets/audio/artist.jpg" alt="Обложка трека zxcursed">
    <div class="audio-meta">
      <div class="audio-song" title="Aura">Aura</div>
      <div class="audio-artist-line">
        <span class="audio-artist" title="zxcursed">zxcursed</span>
        <span>•</span>
        <span class="audio-time">2:38</span>
      </div>
    </div>
    <button class="audio-play-btn" id="audioToggleBtn" title="Воспроизвести трек" aria-label="Воспроизвести трек" type="button">
      <svg class="icon" id="audioStateIcon" viewBox="0 0 24 24" style="fill: currentColor; width: 14px; height: 14px; margin-left: 2px;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
    </button>
    <audio id="screenPlayAudio" src="assets/audio/anthem.mp3" preload="none"></audio>
  </div>
</section>

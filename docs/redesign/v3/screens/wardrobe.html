<div class="wardrobe">
  <div class="wardrobe-viewer-col">
    <canvas id="skinCanvas3D" width="260" height="380" title="Потяните для вращения, колёсико — зум"></canvas>
  </div>

  <div class="wardrobe-controls-col" style="flex:1">
    <div class="small dim" style="margin-bottom:8px">Плащ</div>
    <div class="capes" id="capeSelector">
      <button type="button" class="cape on" data-cape="cyan" title="Плащ Aura">
        <div class="cape-thumb cape-thumb-cyan"></div>
        <span class="cape-title">Aura</span>
      </button>
      <button type="button" class="cape" data-cape="silver" title="Серебряный плащ">
        <div class="cape-thumb cape-thumb-silver"></div>
        <span class="cape-title">Серебряный</span>
      </button>
      <label class="cape" id="capeUploadLabel" title="Загрузить свой плащ (.png)" style="cursor:pointer">
        <div class="cape-thumb cape-thumb-custom" id="customCapeThumb">+</div>
        <span class="cape-title" id="customCapeTitle">Свой</span>
        <input type="file" id="capeFileInput" accept="image/png" style="display:none">
      </label>
      <button type="button" class="cape" data-cape="none" title="Без плаща">
        <div class="cape-thumb cape-thumb-none">✕</div>
        <span class="cape-title">Без плаща</span>
      </button>
    </div>

    <div class="row">
      <span>Анимация</span>
      <div class="seg skin-anim-seg" data-seg="anim" id="animModeSeg">
        <span class="lens"></span>
        <button type="button" class="on" data-anim="idle">Стоит</button>
        <button type="button" data-anim="walk">Идёт</button>
        <button type="button" data-anim="run">Бежит</button>
      </div>
    </div>

    <div class="row">
      <span>Модель</span>
      <div class="seg" style="width:190px" data-seg="model" id="modelTypeSeg">
        <span class="lens"></span>
        <button type="button" class="on" data-model="default">Steve</button>
        <button type="button" data-model="slim">Alex</button>
      </div>
    </div>

    <div class="row">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="face" id="skinFacePreview" style="--s:28px"></div>
        <span>Скин<span class="hint" id="currentSkinFileName">steve.png</span></span>
      </div>
      <label class="btn sm" style="cursor:pointer">
        Загрузить
        <input type="file" id="skinFileInput" accept="image/png" style="display:none">
      </label>
    </div>

    <div class="row">
      <span>Ник</span>
      <input class="field" id="inputPlayerNickname" value="" placeholder="Ваш ник" maxlength="16" autocomplete="off" spellcheck="false" style="width:170px;height:40px">
    </div>

    <div class="row">
      <span>Достижения<span class="hint" id="achHint">—</span></span>
      <button type="button" class="btn sm" id="btnAchOpen">Открыть</button>
    </div>

    <div class="wardrobe-history-section" style="margin-top:10px">
      <div class="small dim" style="margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">
        <span>История гардероба</span>
        <span class="hint" id="historyCounter">0 файлов</span>
      </div>
      <div class="wardrobe-history-list" id="wardrobeHistoryList"></div>
    </div>
  </div>
</div>

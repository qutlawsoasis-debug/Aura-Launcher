<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Aura — Загрузка</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./game.css">
</head>
<body>
  <!-- Layer 1: Vibrant world with slow cinematic zoom -->
  <div class="world-viewport loading-anim"></div>
  
  <!-- Layer 2: Subtle mist -->
  <div class="world-mist"></div>

  <!-- Layer 3: Edge vignette only (center is bright) -->
  <div class="world-vignette"></div>

  <main class="loading-container">
    <div></div>

    <!-- Center brand wordmark with animated sweep flare -->
    <div class="loading-center">
      <h1 class="wordmark-large">Aura</h1>
      <div class="loading-subtext">Сервер друзей</div>
    </div>

    <!-- Bottom progress line & changing hints -->
    <div class="loading-bottom">
      <div class="loading-meta-row">
        <div class="loading-status">
          <span class="dot"></span>
          <span id="loadStage">Загрузка модов 87/130</span>
        </div>
        <div class="loading-hint" id="hintText">Подсказка: клавиша F3+T быстро перезагружает текстуры прямо в игре</div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width: 67%;"></div>
      </div>
    </div>
  </main>

  <script>
    const hints = [
      'Подсказка: клавиша F3+T быстро перезагружает текстуры прямо в игре',
      'Совет: в лобби лаунчера можно позвать друга нажатием одной кнопки',
      'Знаете ли вы? Шейдеры оптимизированы для максимального FPS на встроенной графике'
    ];
    let hintIdx = 0;
    const hintEl = document.getElementById('hintText');
    if (hintEl) {
      setInterval(() => {
        hintIdx = (hintIdx + 1) % hints.length;
        hintEl.style.opacity = '0';
        setTimeout(() => {
          hintEl.textContent = hints[hintIdx];
          hintEl.style.opacity = '1';
        }, 300);
      }, 5000);
    }
  </script>
</body>
</html>

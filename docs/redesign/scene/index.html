<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Aura — сцена из мира</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1016; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/examples/jsm/": "./node_modules/three/examples/jsm/",
  "skinview-utils": "./node_modules/skinview-utils/build/index.js",
  "skinview3d": "./node_modules/skinview3d/libs/skinview3d.js"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { PlayerObject, IdleAnimation } from 'skinview3d';
import { loadSkinToCanvas } from 'skinview-utils';

const meta = await (await fetch('scene/scene.json')).json();
const bin = await (await fetch('scene/scene.bin')).arrayBuffer();
const [OX, OY, OZ] = meta.origin;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Небо: градиент от горизонта к зениту на большой сфере; туман цвета горизонта
const horizon = new THREE.Color('#bcd8ef'), zenith = new THREE.Color('#4f8fd6');
scene.fog = new THREE.Fog(horizon, 60, 260);
{
  const g = new THREE.SphereGeometry(400, 32, 16);
  const c = [];
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const t = Math.max(0, p.getY(i) / 400);
    const col = horizon.clone().lerp(zenith, Math.pow(t, 0.6));
    c.push(col.r, col.g, col.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
  const skyMesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  skyMesh.renderOrder = -1;
  scene.add(skyMesh);
  scene.userData.sky = skyMesh;
}
// Море до горизонта на уровне воды Minecraft (63 − 2/16)
{
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshBasicMaterial({ color: '#2f63a8', transparent: true, opacity: 0.92 }));
  sea.rotation.x = -Math.PI / 2;
  sea.position.y = 62.875 - OY - 0.02;
  scene.add(sea);
}

const atlas = await new THREE.TextureLoader().loadAsync('scene/atlas.png');
atlas.magFilter = THREE.NearestFilter;
atlas.minFilter = THREE.NearestMipmapLinearFilter;
atlas.colorSpace = THREE.SRGBColorSpace;
atlas.flipY = false;

const materials = {
  opaque: new THREE.MeshBasicMaterial({ map: atlas, vertexColors: true }),
  cutout: new THREE.MeshBasicMaterial({ map: atlas, vertexColors: true, alphaTest: 0.5, side: THREE.DoubleSide }),
  translucent: new THREE.MeshBasicMaterial({ map: atlas, vertexColors: true, transparent: true, opacity: 0.78, depthWrite: false, side: THREE.DoubleSide })
};

for (const [name, L] of Object.entries(meta.layers)) {
  if (!L.count) continue;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(bin, L.pos[0], L.pos[1] / 4), 3));
  g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(bin, L.uv[0], L.uv[1] / 4), 2));
  g.setAttribute('color', new THREE.BufferAttribute(new Uint8Array(bin, L.col[0], L.col[1]), 3, true));
  const mesh = new THREE.Mesh(g, materials[name]);
  if (name === 'translucent') mesh.renderOrder = 2;
  scene.add(mesh);
}

// Кадр главного экрана — точка и взгляд игрока из F3: XYZ -370.904 100 2591.909, поворот 66.8, наклон -0.8
const eye = new THREE.Vector3(-370.904 - OX, 100 + 1.62 - OY, 2591.909 - OZ);
const yaw = THREE.MathUtils.degToRad(66.8), pitch = THREE.MathUtils.degToRad(-0.8);
const dir = new THREE.Vector3(-Math.sin(yaw) * Math.cos(pitch), -Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 1200);
camera.position.copy(eye);
camera.lookAt(eye.clone().add(dir));
const qs = new URLSearchParams(location.search);
const view = qs.get('view');
// ?cam=x,y,z,yaw,pitch — кадр в координатах мира (как в F3: XYZ ног, поворот, наклон)
if (qs.get('cam')) {
  const [cx, cy, cz, cyaw, cpitch] = qs.get('cam').split(',').map(Number);
  const yw = THREE.MathUtils.degToRad(cyaw), pt = THREE.MathUtils.degToRad(cpitch);
  camera.position.set(cx - OX, cy + 1.62 - OY, cz - OZ);
  camera.lookAt(camera.position.clone().add(new THREE.Vector3(-Math.sin(yw) * Math.cos(pt), -Math.sin(pt), Math.cos(yw) * Math.cos(pt))));
}
if (view === 'top') { scene.fog = null; camera.position.set(48, 150, 48 + 0.01); camera.lookAt(48, 40, 48); camera.fov = 50; camera.updateProjectionMatrix(); }
if (view === 'side') { camera.position.set(48 + 75, 18, 48 + 60); camera.lookAt(48, 38, 48); }

// Персонаж в 4.5 блоках перед камерой, лицом к ней; место под 2 игроков слева и 2 справа
const player = new PlayerObject();
const skinCanvas = document.createElement('canvas');
const skinImg = new Image();
skinImg.src = 'scene/steve.png';
await skinImg.decode();
loadSkinToCanvas(skinCanvas, skinImg);
const skinTex = new THREE.CanvasTexture(skinCanvas);
skinTex.magFilter = THREE.NearestFilter;
skinTex.colorSpace = THREE.SRGBColorSpace;
player.skin.map = skinTex;
player.scale.setScalar(1 / 16);
const flat = new THREE.Vector3(dir.x, 0, dir.z).normalize();
const spot = eye.clone().addScaledVector(flat, 4.5);
spot.y = 100 - OY;
player.position.copy(spot).add(new THREE.Vector3(0, 0, 0));
player.rotation.y = Math.atan2(-flat.x, -flat.z);
scene.add(player);
// Свет нужен материалу скина (MeshStandardMaterial); блоки освещены «запечённо» через цвета вершин
scene.add(new THREE.HemisphereLight('#dfefff', '#5a4a3a', 1.6));
const sun = new THREE.DirectionalLight('#fff4e0', 1.6);
sun.position.set(-30, 60, 20);
scene.add(sun);
const idle = new IdleAnimation();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  if (scene.userData.sky) scene.userData.sky.position.copy(camera.position);
  const dt = clock.getDelta();
  idle.update(player, dt);
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});
window.__ready = true;
</script>
</body>
</html>

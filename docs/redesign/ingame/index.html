<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura — игровое меню</title>
<link rel="icon" href="data:,">
<script src="./lucide.min.js"></script>
<script>

// Динамическая загрузка шрифта Onest под протокол (без 404 в браузере)
(function() {
  const isHttp = location.protocol.startsWith('http');
  const fontUrl = isHttp ? '../v3/public/assets/fonts/Onest.woff2' : './fonts/Onest.woff2';
  const st = document.createElement('style');
  st.textContent = `@font-face { font-family: 'Onest'; src: url('${fontUrl}') format('woff2'); font-weight: 100 900; font-display: block; }`;
  document.head.appendChild(st);
})();
</script>
<style>

:root {
  --accent: #64D2FF;
  --accent-rgb: 100, 210, 255;
  --accent-ink: #00283A;

  --ink: #fff;
  --ink-2: rgba(255,255,255,.72);
  --ink-3: rgba(255,255,255,.48);
  --ink-4: rgba(255,255,255,.30);

  --fill: rgba(118,118,128,.24);
  --fill-2: rgba(118,118,128,.36);
  --fill-3: rgba(118,118,128,.50);
  --hair: rgba(255,255,255,.08);
  --line: rgba(255,255,255,.14);

  --glass: rgba(22,26,34,.58);
  --glass-2: rgba(30,35,45,.62);
  --card: rgba(255,255,255,.045);
  --card-hover: rgba(255,255,255,.075);
  --sheen: inset 0 1px 0 rgba(255,255,255,.14);
  --shadow: 0 30px 80px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.25);

  --danger: #FF6B6B;
  --r-xl: 28px; --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --ease: cubic-bezier(.22,1,.36,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

/* ============ КАСТОМНЫЙ СКРОЛЛБАР AURA (APPLE GLASS 6PX) ============ */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-button {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
::-webkit-scrollbar-corner {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  transition: background 0.2s ease;
}
*:hover::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.22);
}
*:hover::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.40);
}
* {
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
}

body {
  background: #05070b; color: var(--ink); overflow: hidden;
  font-family: 'Onest', system-ui, sans-serif; font-size: 15px;
  -webkit-font-smoothing: antialiased; user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
svg.lucide { width: 18px; height: 18px; stroke-width: 1.8; flex: none; }

/* ============ МИР ============ */
.world { position: fixed; inset: 0; background-position: center; background-size: cover; }
.world::after { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.35)); }

/* Единственный живой слой размытия (в игре — шейдер) */
.veil {
  position: fixed; inset: 0; z-index: 5; pointer-events: none;
  backdrop-filter: blur(0px) saturate(100%); -webkit-backdrop-filter: blur(0px) saturate(100%);
  background: rgba(4,8,14,0);
  transition: backdrop-filter .45s var(--ease), -webkit-backdrop-filter .45s var(--ease), background .45s var(--ease);
}
body:not([data-view="game"]) .veil {
  backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
  background: rgba(4,8,14,.38);
}
body[data-fx="low"] .veil, body[data-fx="off"] .veil {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}
/* Внутри игры: мир и размытие рисует Minecraft, страница прозрачная */
body.ingame { background: transparent; }
body.ingame .world, body.ingame .hud, body.ingame .mock-bar { display: none; }
body.ingame .veil { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
body.ingame:not([data-view="game"]) .veil { background: rgba(4,8,14,.30); }
body[data-fx="low"]:not([data-view="game"]) .veil { background: rgba(6,10,16,.75); }
body[data-fx="off"]:not([data-view="game"]) .veil { background: rgba(6,10,16,.88); }

/* Режимы эффектов low/off: отключение тяжелых анимаций и свечений */
body[data-fx="low"] .dot, body[data-fx="off"] .dot { box-shadow: none !important; }
body[data-fx="low"] .panel, body[data-fx="low"] .sheet, body[data-fx="low"] .btn { box-shadow: 0 4px 14px rgba(0,0,0,.35) !important; }

body[data-fx="off"] *, body[data-fx="off"] *::before, body[data-fx="off"] *::after {
  animation: none !important;
  transition-duration: 0.001s !important;
}
body[data-fx="off"] .panel, body[data-fx="off"] .sheet, body[data-fx="off"] .btn { box-shadow: none !important; }

/* Standalone режим настроек (из главного меню, без активного мира): тёмный градиент + лёгкий шум */
body.standalone {
  background: radial-gradient(120% 120% at 50% 20%, #0d131d 0%, #05070b 100%) !important;
}
body.standalone::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}
body.standalone .veil {
  background: rgba(4,8,14,.45) !important;
}

/* ============ HUD ============ */
.hud { position: fixed; inset: 0; z-index: 2; pointer-events: none; transition: opacity .35s var(--ease); }
body:not([data-view="game"]) .hud { opacity: .0; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px;
  border-radius: 999px; background: rgba(14,18,24,.55); border: 1px solid var(--hair);
  box-shadow: var(--sheen); font-size: 12.5px; color: var(--ink-2); font-weight: 500;
}
.pill b { color: var(--ink); font-weight: 600; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb),.8); }
.hud-tl { position: absolute; top: 14px; left: 14px; display: flex; flex-direction: column; gap: 8px; }
.hud-card { width: 168px; padding: 10px 12px; border-radius: 14px; background: rgba(14,18,24,.55); border: 1px solid var(--hair); box-shadow: var(--sheen); display: grid; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
.hud-card div { display: flex; align-items: center; gap: 8px; }
.hud-card svg.lucide { width: 14px; height: 14px; color: var(--accent); }
.hud-tc { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.crosshair { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; transform: translate(-50%,-50%); }
.crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,.9); }
.crosshair::before { left: 6px; top: 0; width: 2px; height: 14px; }
.crosshair::after { top: 6px; left: 0; height: 2px; width: 14px; }
.hotbar { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; border-radius: 14px; background: rgba(14,18,24,.5); border: 1px solid var(--hair); }
.hotbar i { width: 38px; height: 38px; border-radius: 9px; background: rgba(255,255,255,.05); border: 1px solid transparent; }
.hotbar i.on { border-color: rgba(var(--accent-rgb),.8); background: rgba(var(--accent-rgb),.12); }
.hint-esc { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); }

/* ============ ОБЩИЕ СЛОИ ============ */
.layer { position: fixed; inset: 0; z-index: 10; display: none; place-items: center; pointer-events: none; }
body[data-view="esc"] #esc { display: grid; pointer-events: auto; }

/* Cascade card animation for Esc menu (40ms staggering) */
@keyframes escCardCascade {
  0% {
    opacity: 0;
    transform: translateY(14px) scale(0.96);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

body[data-view="esc"] #esc .esc-main {
  animation: escCardCascade 0.30s cubic-bezier(0.16, 1, 0.3, 1) both;
  animation-delay: 0.04s;
}

body[data-view="esc"] #esc .btn-play {
  animation: escCardCascade 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
  animation-delay: 0.08s;
}

body[data-view="esc"] #esc .tile:nth-child(1) {
  animation: escCardCascade 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
  animation-delay: 0.12s;
}

body[data-view="esc"] #esc .tile:nth-child(2) {
  animation: escCardCascade 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
  animation-delay: 0.16s;
}

body[data-view="esc"] #esc .tile:nth-child(3) {
  animation: escCardCascade 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
  animation-delay: 0.20s;
}

body[data-view="esc"] #esc .tile:nth-child(4) {
  animation: escCardCascade 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
  animation-delay: 0.24s;
}

body[data-view="esc"] #esc .tile:nth-child(5) {
  animation: escCardCascade 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
  animation-delay: 0.28s;
}

body[data-view="esc"] #esc .tile:nth-child(6) {
  animation: escCardCascade 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
  animation-delay: 0.32s;
}

body[data-view="esc"] #esc .esc-side .side-card:nth-child(1) {
  animation: escCardCascade 0.30s cubic-bezier(0.16, 1, 0.3, 1) both;
  animation-delay: 0.12s;
}

body[data-view="esc"] #esc .esc-side .side-card:nth-child(2) {
  animation: escCardCascade 0.30s cubic-bezier(0.16, 1, 0.3, 1) both;
  animation-delay: 0.16s;
}

body[data-view="settings"] #settings { display: grid; pointer-events: auto; }
.layer > * {
  opacity: 1;
  transform: none;
}
.glass {
  background: var(--glass); border: 1px solid var(--line);
  box-shadow: var(--sheen), var(--shadow); border-radius: var(--r-xl);
  position: relative;
}
.glass::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.07), transparent 22%);
}
.kbd { display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--fill); border: 1px solid var(--hair); font-size: 11px; font-weight: 600; color: var(--ink-2); }

/* ============ ESC ============ */
#esc .wrap { display: grid; grid-template-columns: 400px 340px; gap: 16px; align-items: start; justify-content: center; }
#esc .wrap.no-side { grid-template-columns: 460px; }
.esc-main { padding: 22px; display: grid; gap: 16px; }
.me { display: flex; align-items: center; gap: 12px; }
.head { width: 44px; height: 44px; border-radius: 12px; background-size: cover; background-position: center; image-rendering: pixelated; box-shadow: 0 0 0 1px var(--line); flex: none; }
.me-name { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.me-sub { font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.me .ping { margin-left: auto; }
.btn-play {
  height: 56px; border-radius: 16px; background: var(--accent); color: var(--accent-ink);
  font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 10px 30px rgba(var(--accent-rgb),.35), inset 0 1px 0 rgba(255,255,255,.5);
  transition: transform .25s var(--spring), box-shadow .25s var(--ease), filter .2s;
}
.btn-play:hover { transform: translateY(-1px) scale(1.01); filter: brightness(1.06); box-shadow: 0 14px 40px rgba(var(--accent-rgb),.45), inset 0 1px 0 rgba(255,255,255,.5); }
.btn-play:active { transform: scale(.985); }
.btn-play svg.lucide { width: 20px; height: 20px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 18px; padding: 14px; border-radius: 16px;
  background: var(--card); border: 1px solid var(--hair); text-align: left;
  transition: background .2s, border-color .2s, transform .3s var(--ease);
}
.tile:hover { background: var(--card-hover); border-color: var(--line); transform: translateY(-2px); }
.tile .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--fill); color: var(--ink); transition: background .2s, color .2s, box-shadow .2s; }
.tile:hover .ic { background: rgba(var(--accent-rgb),.18); color: var(--accent); box-shadow: 0 0 18px rgba(var(--accent-rgb),.25); }
.tile b { font-size: 15px; font-weight: 600; display: block; }
.tile small { font-size: 12.5px; color: var(--ink-3); display: block; margin-top: 3px; }
.esc-foot { display: flex; gap: 8px; }
.btn-ghost { flex: 1; height: 44px; border-radius: 13px; background: var(--fill); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; font-size: 14px; color: var(--ink-2); transition: background .2s, color .2s; }
.btn-ghost:hover { background: var(--fill-2); color: var(--ink); }
.btn-ghost.danger:hover { background: rgba(255,107,107,.16); color: var(--danger); }

.esc-side { display: grid; gap: 16px; }
.side-card { padding: 18px; }
.cap { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.status-online { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; color: var(--ink-3); text-transform: none; letter-spacing: normal; }
.dot-soft { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0.85; }
.world-name { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.world-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.meta { padding: 10px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--hair); }
.meta small { font-size: 11.5px; color: var(--ink-3); display: block; }
.meta b { font-size: 15px; font-weight: 600; display: block; margin-top: 2px; }
.player { display: flex; align-items: center; gap: 10px; padding: 8px; margin: 0 -8px; border-radius: 12px; transition: background .2s; }
.player:hover { background: var(--card); }
.player .av { flex: none !important; width: 30px; height: 30px; border-radius: 9px; background: var(--fill-2); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.player span { font-size: 14px; font-weight: 500; flex: 1; }
.player em { font-style: normal; font-size: 12px; color: var(--ink-3); }
.players-empty { display: flex; align-items: center; gap: 8px; padding: 12px 8px; color: var(--ink-4); font-size: 13px; }
.players-empty svg.lucide { width: 15px; height: 15px; color: var(--ink-4); }

/* ============ НАСТРОЙКИ ============ */
#settings .win { width: min(1180px, calc(100vw - 48px)); height: min(720px, calc(100vh - 48px)); display: grid; grid-template-columns: 248px 340px 1fr; padding: 10px; gap: 10px; }
.col { border-radius: 20px; min-height: 0; display: flex; flex-direction: column; }
.nav { background: rgba(255,255,255,.035); border: 1px solid var(--hair); padding: 14px 10px 10px; overflow: hidden; height: 100%; display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; flex-shrink: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: radial-gradient(circle at 30% 30%, #b8ecff, var(--accent) 45%, #1b6f92); box-shadow: 0 0 18px rgba(var(--accent-rgb),.5); }
.brand b { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.brand small { display: block; font-size: 11.5px; color: var(--ink-3); }
.search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 12px; background: var(--fill); border: 1px solid transparent; margin: 0 2px 10px; transition: border-color .2s, background .2s; flex-shrink: 0; }
#nav { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-right: 2px; display: flex; flex-direction: column; }
.search:focus-within { border-color: rgba(var(--accent-rgb),.6); background: var(--fill-2); }
.search svg.lucide { width: 16px; height: 16px; color: var(--ink-3); }
.search input { flex: 1; background: none; border: 0; outline: 0; font-size: 13.5px; }
.search input::placeholder { color: var(--ink-3); }
.nav-group { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-4); padding: 10px 10px 6px; flex-shrink: 0; }
.nav-group:first-child { padding-top: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; min-height: 36px; height: 36px; padding: 0 10px; border-radius: 11px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); width: 100%; position: relative; transition: background .15s, color .15s; flex-shrink: 0; }
.nav-item:hover { background: var(--card); color: var(--ink); }
.nav-item.on { background: rgba(var(--accent-rgb),.14); color: var(--ink); }
.nav-item.on svg.lucide { color: var(--accent); }
.nav-item.on::before { content: ''; position: absolute; left: -10px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }
.nav-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; border-top: 1px solid var(--hair); }
.nav-foot .head { width: 32px; height: 32px; border-radius: 9px; background-size: cover; background-position: center; }
.nav-foot b { font-size: 13.5px; font-weight: 600; display: block; }
.nav-foot small { font-size: 11.5px; color: var(--ink-3); display: block; }

.list { padding: 16px 8px 8px; }
.col-head { padding: 0 10px 12px; }
.col-head h2 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
.col-head h2 svg.lucide { width: 22px; height: 22px; color: var(--accent); }
.col-head p { font-size: 13px; color: var(--ink-3); margin-top: 4px; }
.scroll { overflow-y: auto; min-height: 0; flex: 1; padding: 0 4px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 8px 10px; border-radius: 14px; text-align: left; border: 1px solid transparent; transition: background .2s, border-color .2s; opacity: 0; transform: translateY(6px); animation: rowIn .4s var(--ease) forwards; }
@keyframes rowIn { to { opacity: 1; transform: none; } }
.row:hover { background: var(--card); }
.row.on { background: var(--card-hover); border-color: var(--line); }
.row .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--fill); flex: none; transition: background .2s, color .2s; }
.row.on .ic { background: rgba(var(--accent-rgb),.18); color: var(--accent); }
.row .t { flex: 1; min-width: 0; }
.row .t b { font-size: 14.5px; font-weight: 500; display: block; }
.row .t small { font-size: 12px; color: var(--ink-3); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.row .val { font-size: 13px; color: var(--ink-2); font-weight: 500; font-variant-numeric: tabular-nums; }

.switch { width: 42px; height: 25px; border-radius: 999px; background: var(--fill-2); position: relative; flex: none; transition: background .25s var(--ease), box-shadow .25s; cursor: pointer; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .35s var(--spring); }
.switch.on { background: var(--accent); box-shadow: 0 0 16px rgba(var(--accent-rgb),.45); }
.switch.on::after { transform: translateX(17px); }

.detail { background: rgba(255,255,255,.035); border: 1px solid var(--hair); padding: 20px 22px; position: relative; overflow: hidden; }
.detail-inner { display: flex; flex-direction: column; gap: 18px; height: 100%; min-height: 0; }
.detail-inner.swap { animation: swapIn .38s var(--ease); }
@keyframes swapIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
.d-head { display: flex; align-items: flex-start; gap: 14px; }
.d-head .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: rgba(var(--accent-rgb),.16); color: var(--accent); box-shadow: 0 0 24px rgba(var(--accent-rgb),.2); flex: none; }
.d-head .ic svg.lucide { width: 22px; height: 22px; }
.d-head h3 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.d-head p { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; line-height: 1.45; max-width: 460px; }
.d-head .close { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--fill); color: var(--ink-2); transition: background .2s, color .2s, transform .3s var(--spring); }

function fetchMods() {
  modsLoading = true;
  modsError = null;
  sendQuery({ op: 'mods_get' }, res => {
    modsLoading = false;
    if (res && res.ok && Array.isArray(res.mods)) {
      cachedMods = res.mods;
      modsError = null;
    } else {
      cachedMods = null;
      modsError = (res && res.error) || 'Не удалось загрузить';
    }
    if (state.section === 'mods') renderDetail(false);
  }, (code, msg) => {
    modsLoading = false;
    cachedMods = null;
    modsError = 'Не удалось загрузить';
    if (state.section === 'mods') renderDetail(false);
  });
}

function openModConfig(modId) {
  sendQuery({ op: 'mod_config_open', id: modId }, res => {
    if (!res || !res.ok) {
      showToast('Экран настроек мода недоступен', true);
    }
  });
}

let packsLoading = false;
let packsError = null;

function fetchResourcePacks() {
  packsLoading = true;
  packsError = null;
  sendQuery({ op: 'resourcepacks_get' }, res => {
    packsLoading = false;
    if (res && res.ok) {
      cachedPacks = {
        enabled: res.enabled || [],
        available: res.available || []
      };
      packsError = null;
    } else {
      cachedPacks = null;
      packsError = (res && res.error) || 'Не удалось загрузить';
    }
    if (state.section === 'resourcepacks') renderDetail(false);
  }, () => {
    packsLoading = false;
    cachedPacks = null;
    packsError = 'Не удалось загрузить';
    if (state.section === 'resourcepacks') renderDetail(false);
  });
}

function packEnable(id) {
  if (!cachedPacks) return;
  const idx = cachedPacks.available.findIndex(p => p.id === id);
  if (idx !== -1) {
    const [p] = cachedPacks.available.splice(idx, 1);
    p.enabled = true;
    cachedPacks.enabled.push(p);
    renderDetail(false);
  }
}

function packDisable(id) {
  if (!cachedPacks) return;
  const idx = cachedPacks.enabled.findIndex(p => p.id === id);
  if (idx !== -1 && !cachedPacks.enabled[idx].isAlwaysEnabled) {
    const [p] = cachedPacks.enabled.splice(idx, 1);
    p.enabled = false;
    cachedPacks.available.push(p);
    renderDetail(false);
  }
}

function packMove(id, dir) {
  if (!cachedPacks) return;
  const idx = cachedPacks.enabled.findIndex(p => p.id === id);
  if (idx === -1) return;
  const targetIdx = idx + dir;
  if (targetIdx < 0 || targetIdx >= cachedPacks.enabled.length) return;
  const item = cachedPacks.enabled.splice(idx, 1)[0];
  cachedPacks.enabled.splice(targetIdx, 0, item);
  renderDetail(false);
}

function packApply() {
  if (!cachedPacks) return;
  const ids = cachedPacks.enabled.map(p => p.id);
  showToast('Применение наборов ресурсов...');
  sendQuery({ op: 'resourcepacks_set', enabled: ids }, res => {
    if (res && res.ok) showToast('Наборы ресурсов применены');
    else showToast('Ошибка применения', true);
  }, () => {
    showToast('Ошибка применения', true);
  });
}

  if (it.type === 'cards') return (it.options.find(o => o.v === it.value) || {}).n || '';

function pluralChunks(n) {
  const abs = Math.abs(n) % 100;
  const rem = abs % 10;
  if (abs > 10 && abs < 20) return `${n} чанков`;
  if (rem > 1 && rem < 5) return `${n} чанка`;
  if (rem === 1) return `${n} чанк`;
  return `${n} чанков`;
}

function recomputeConflicts() {
  if (!gameKeys) return;
  const usage = {};
  for (const k of gameKeys) {
    if (!k.isUnbound && k.key && k.key !== '—') {
      if (!usage[k.key]) usage[k.key] = [];
      usage[k.key].push(k.name);
    }
  }
  for (const k of gameKeys) {
    const list = (!k.isUnbound && k.key && k.key !== '—') ? usage[k.key] : null;
    if (list && list.length > 1) {
      k.conflict = true;
      const others = list.filter(n => n !== k.name);
      k.conflictWith = others.join(', ') || 'другое действие';
    } else {
      k.conflict = false;
      k.conflictWith = '';
    }
  }
}

function fetchKeys(cb) {
  keysLoading = true;
  keysLoadError = false;
  sendQuery({ op: 'keys_get' }, resp => {
    keysLoading = false;
    if (resp && resp.ok && Array.isArray(resp.keys)) {
      gameKeys = resp.keys;
      keysLoadError = false;
    } else {
      gameKeys = null;
      keysLoadError = true;
    }
    recomputeConflicts();
    if (cb) cb();
    else if (state.item === 'binds') renderDetail(false);
  }, () => {
    keysLoading = false;
    gameKeys = null;
    keysLoadError = true;
    recomputeConflicts();
    if (cb) cb();
    else if (state.item === 'binds') renderDetail(false);
  });
}

function getGlfwKeyName(code, e) {
  if (code === -1) return '—';
  // Только физический код клавиши (латиницей): e.key зависит от раскладки ОС
  if (e && e.code) {
    if (e.code.startsWith('Key')) return e.code.substring(3);
    if (e.code.startsWith('Digit')) return e.code.substring(5);
    if (e.code.startsWith('Numpad')) return 'Num ' + e.code.substring(6);
    if (e.code === 'Space') return 'Space';
    if (e.code === 'ShiftLeft') return 'Left Shift';
    if (e.code === 'ShiftRight') return 'Right Shift';
    if (e.code === 'ControlLeft') return 'Left Ctrl';
    if (e.code === 'ControlRight') return 'Right Ctrl';
    return e.code;
  }
  return String.fromCharCode(code);
}

function startKeyListen(id) {
  listeningKeyId = id;
  listenActivatedAt = Date.now();
  renderDetail(false);
}

function stopKeyListen() {
  listeningKeyId = null;
  listenActivatedAt = 0;
}

function handleGlobalKeyBind(e) {
  if (!listeningKeyId) return;
  e.preventDefault();
  e.stopPropagation();

  if (e.key === 'Escape') {
    stopKeyListen();
    renderDetail(false);
    showToast('Назначение отменено');
    return;
  }

  const targetId = listeningKeyId;
  let code = -1;
  let type = 'key';

  if (e.key === 'Backspace' || e.key === 'Delete') {
    code = -1;
    type = 'key';
  } else {
    code = GLFW_KEY_MAP[e.code] || e.keyCode;
    type = 'key';
  }

  applyKeySet(targetId, code, type, getGlfwKeyName(code, e));
}

function handleGlobalMouseBind(e) {
  if (!listeningKeyId) return;
  if (Date.now() - listenActivatedAt < 120) return;

  e.preventDefault();
  e.stopPropagation();

  const targetId = listeningKeyId;
  const button = e.button;
  const glfwButton = GLFW_MOUSE_MAP[button] !== undefined ? GLFW_MOUSE_MAP[button] : button;
  const label = 'Кнопка мыши ' + (button + 1);

  applyKeySet(targetId, glfwButton, 'mouse', label);
}

function applyKeySet(id, code, type, label) {
  if (INGAME) {
    sendQuery({ op: 'key_set', id: id, code: code, type: type }, resp => {
      if (resp && resp.ok) {
        fetchKeys(() => {
          stopKeyListen();
          renderDetail(false);
          showToast(code === -1 ? 'Клавиша сброшена' : `Клавиша: ${label}`);
        });
      } else {
        stopKeyListen();
        renderDetail(false);
        showToast('Ошибка назначения клавиши', true);
      }
    }, () => {
      stopKeyListen();
      renderDetail(false);
      showToast('Ошибка моста', true);
    });
  } else {
    const item = gameKeys ? gameKeys.find(k => k.id === id) : null;
    if (item) {
      if (code === -1) {
        item.key = '—';
        item.isUnbound = true;
        item.isDefault = false;
      } else {
        item.key = label;
        item.isUnbound = false;
        item.isDefault = (item.key === item.defaultKey);
      }
      recomputeConflicts();
      stopKeyListen();
      renderDetail(false);
      showToast(code === -1 ? 'Клавиша сброшена' : `Клавиша: ${label}`);
    }
  }
}

function resetKey(id) {
  if (INGAME) {
    sendQuery({ op: 'key_reset', id: id }, resp => {
      fetchKeys(() => {
        renderDetail(false);
        showToast('Сброшено по умолчанию');
      });
    });
  } else {
    const item = gameKeys ? gameKeys.find(k => k.id === id) : null;
    if (item) {
      item.key = item.defaultKey;
      item.isUnbound = false;
      item.isDefault = true;
      recomputeConflicts();
      renderDetail(false);
      showToast('Сброшено по умолчанию');
    }
  }
}

function resetAllKeys() {
  if (INGAME) {
    sendQuery({ op: 'key_reset', id: 'all' }, resp => {
      fetchKeys(() => {
        renderDetail(false);
        showToast('Все клавиши сброшены');
      });
    });
  } else {
    if (gameKeys) {
      for (const k of gameKeys) {
        k.key = k.defaultKey;
        k.isUnbound = false;
        k.isDefault = true;
      }
      recomputeConflicts();
      renderDetail(false);
      showToast('Все клавиши сброшены');
    }
  }
}

window.addEventListener('keydown', handleGlobalKeyBind, true);
window.addEventListener('mousedown', handleGlobalMouseBind, true);


let modIconObserver = null;
function setupLazyModIcons() {
  if (modIconObserver) {
    modIconObserver.disconnect();
    modIconObserver = null;
  }
  const lazyImgs = document.querySelectorAll('.lazy-mod-icon[data-src]');
  if (!lazyImgs.length) return;
  if ('IntersectionObserver' in window) {
    modIconObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          if (img.dataset.src) {
            img.src = img.dataset.src;
            img.removeAttribute('data-src');
            img.style.opacity = '1';
          }
          obs.unobserve(img);
        }
      });
    }, { root: document.querySelector('.mods-list'), rootMargin: '100px 0px' });
    lazyImgs.forEach(img => modIconObserver.observe(img));
  } else {
    lazyImgs.forEach(img => {
      img.src = img.dataset.src;
      img.removeAttribute('data-src');
      img.style.opacity = '1';
    });
  }
}

const INGAME = new URLSearchParams(location.search).has('ingame');
const STANDALONE = new URLSearchParams(location.search).has('standalone');

function sendQuery(obj, onSuccess, onFailure) {
  const reqStr = typeof obj === 'string' ? obj : JSON.stringify(obj);
  console.log('[aura-ui CEF INPUT] sendQuery:', reqStr);
  function exec() {
    try {
      window.cefQuery({
        request: reqStr,
        onSuccess: resp => {
          let parsed = null;
          try { parsed = JSON.parse(resp); } catch (e) { parsed = resp; }
          if (onSuccess) onSuccess(parsed);
        },
        onFailure: (code, msg) => {
          console.warn('cefQuery error:', code, msg);
          if (onFailure) onFailure(code, msg);
        }
      });
    } catch (err) {
      console.warn('cefQuery exception:', err);
      if (onFailure) onFailure(-1, err.message);
    }
  }

  if (typeof window.cefQuery === 'function') {
    exec();
  } else {
    let attempts = 0;
    const timer = setInterval(() => {
      attempts++;
      if (typeof window.cefQuery === 'function') {
        clearInterval(timer);
        exec();
      } else if (attempts >= 25) {
        clearInterval(timer);
        console.warn('cefQuery not available after retries');
        if (onFailure) onFailure(-1, 'no cefQuery');
      }
    }, 40);
  }
}

const toGame = action => { sendQuery({ op: 'action', name: action }); };

function setView(v) {
  if (STANDALONE && INGAME && (v === 'game' || v === 'esc')) return toGame('back');
  if (INGAME && v === 'game') return toGame('resume');

  if (v === 'settings') { renderAll(); }
}

function applyTheme(id) {
  const t = THEMES.find(x => x.id === id);
  if (!t) return;
  const r = document.documentElement.style;

}

function applyGameValues(vals) {
  for (const [id, val] of Object.entries(vals)) {
    const it = findItem(id);
    if (!it) continue;

}

function onSettingChanged(id, newVal, oldVal) {
  console.log('[aura-ui CEF INPUT] onSettingChanged: id=' + id + ' newVal=' + newVal + ' oldVal=' + oldVal + ' INGAME=' + INGAME);
  if (!GAME_SETTINGS.has(id)) {
    console.warn('[aura-ui CEF INPUT] ignored setting (not in GAME_SETTINGS):', id);
    return;
  }
  if (!INGAME) return;

  sendQuery({ op: 'set', id: id, value: newVal }, resp => {
    if (resp && resp.ok === false) {
      // Откатить значение при ошибке
      const it = findItem(id);
      if (it) {
        it.value = oldVal;
        renderRows();
        renderDetail(false);
        paint();
      }
      showToast(resp.error || 'Ошибка применения', true);

    const it = findItem(id);
    if (it) {
      it.value = oldVal;
      renderRows();
      renderDetail(false);
      paint();
    }
    showToast('Ошибка моста: ' + msg, true);

}

function applyEscState(resp) {
  const data = resp && typeof resp === 'object' && !Array.isArray(resp) && resp.ok !== false ? resp : {};
  const text = value => typeof value === 'string' ? value.trim() : '';
  const showText = (element, value, display = 'block') => {
    element.textContent = value;
    element.style.display = value ? display : 'none';
  };
  const playerName = text(data.player || data.username || data.name);
  const worldName = text(data.world);
  const meEl = document.querySelector('.me');
  if (meEl) {
    meEl.style.display = (playerName || worldName) ? 'flex' : 'none';
  }
  document.querySelectorAll('.me-name, #navFootName').forEach(el => showText(el, playerName));
  document.querySelectorAll('.head').forEach(el => setPlayerHead(el, playerName || 'Steve'));
  showText(document.querySelector('.me-sub'), worldName);
  showText(document.getElementById('worldTitle'), worldName);

  const multiplayer = data.is_singleplayer === false;
  const latency = multiplayer && Number.isInteger(data.latency) && data.latency >= 0;
  document.getElementById('mePingVal').textContent = latency ? data.latency + ' мс' : '';
  document.getElementById('mePing').style.display = latency ? 'inline-flex' : 'none';

  const day = Number.isInteger(data.world_day) && data.world_day >= 0;
  const time = text(data.world_time);
  const meta = [
    ['rowPlayTime', 'valPlayTime', text(data.session_time)],
    ['rowDay', 'valDay', day ? String(data.world_day) + (time ? ' · ' + time : '') : time],
    ['rowVer', 'valVer', text(data.game_version)]
  ];
  for (const [rowId, valueId, value] of meta) {
    document.getElementById(valueId).textContent = value;
    document.getElementById(rowId).style.display = value ? 'block' : 'none';
  }
  const hasWorld = !!text(data.world) || meta.some(([, , value]) => !!value);
  document.getElementById('worldCard').style.display = hasWorld ? 'block' : 'none';
  const modes = { survival: 'Выживание', creative: 'Творчество', adventure: 'Приключение', spectator: 'Наблюдатель' };
  const mode = Object.hasOwn(modes, data.game_mode) ? modes[data.game_mode] : '';
  showText(document.getElementById('worldOnlineText'), mode, 'inline');
  document.getElementById('worldOnlineStatus').style.display = hasWorld && mode ? 'inline-flex' : 'none';

  const players = Array.isArray(data.online_players)
    ? data.online_players.filter(p => p && text(p.name)) : [];
  const list = document.getElementById('playersList');
  list.replaceChildren();
  for (const player of players) {
    const row = document.createElement('div');
    row.className = 'player';
    const avatar = document.createElement('span');
    avatar.className = 'av';
    avatar.textContent = text(player.name).charAt(0).toUpperCase();
    const name = document.createElement('span');
    name.textContent = text(player.name);
    row.append(avatar, name);
    if (multiplayer && Number.isInteger(player.latency) && player.latency >= 0) {
      const ping = document.createElement('em');
      ping.textContent = player.latency + ' мс';
      row.append(ping);
    }
    list.append(row);
  }
  document.getElementById('playersCount').textContent = players.length ? String(players.length) : '';
  document.getElementById('playersCard').style.display = players.length ? 'block' : 'none';
  const hasSide = hasWorld || players.length > 0;
  document.getElementById('escSideContainer').style.display = hasSide ? 'grid' : 'none';
  document.querySelector('#esc .wrap').classList.toggle('no-side', !hasSide);
}

let bridgeRequestId = 0;
function initBridge() {
  const requestId = ++bridgeRequestId;
  applyEscState(null);
  if (!INGAME) return;
  sendQuery({ op: 'session' }, u => {
    if (requestId !== bridgeRequestId || !u) return;
    const p = (u.player || u.name || u.username || '').trim();
    if (p) {
      const meEl = document.querySelector('.me');
      if (meEl) meEl.style.display = 'flex';
      document.querySelectorAll('.me-name, #navFootName').forEach(el => {
        el.textContent = p;
        el.style.display = 'block';
      });
      document.querySelectorAll('.head').forEach(el => setPlayerHead(el, p));
    }
  });
  sendQuery({ op: 'get' }, resp => {
    if (requestId !== bridgeRequestId || !resp || typeof resp !== 'object' || Array.isArray(resp) || resp.ok === false) return;
    if (resp.resolutions && Array.isArray(resp.resolutions)) {
      const resItem = findItem('resolution');
      if (resItem) {
        resItem.options = resp.resolutions.map(r => [r.id, r.label]);
      }
    }
    if (resp.values) {
      applyGameValues(resp.values);
    }
    if (Array.isArray(resp.keys)) {
      gameKeys = resp.keys;
      recomputeConflicts();
    } else {
      fetchKeys();
    }
    applyEscState(resp);
    renderAll(false);
  }, () => {
    if (requestId === bridgeRequestId) applyEscState(null);
  });
}

/* слайдеры */
let drag = null;
function slideTo(el, x) {
  const r = el.getBoundingClientRect(), min = +el.dataset.min, max = +el.dataset.max;
  const pad = 8;
  const trackW = Math.max(1, r.width - pad * 2);
  const p = Math.min(1, Math.max(0, (x - (r.left + pad)) / trackW));
  const step = +(el.dataset.step || 1);
  let v = min + p * (max - min);
  v = Math.round(v / step) * step;
  v = Math.max(min, Math.min(max, v));
  const pp = (v - min) / (max - min) * 100;
  el.querySelector('.fill').style.width = pp + '%';
  el.querySelector('.knob').style.left = `calc(${pad}px + (100% - ${pad * 2}px) * ${pp / 100})`;
  const id = el.dataset.slider;
  const out = document.querySelector(`[data-out="${id}"]`); if (out) out.textContent = (id === 'render' || id === 'sim') ? pluralChunks(v) : (v + el.dataset.unit);
  if (id.endsWith('-x')) findItem(id.slice(0, -2)).extra.value = v; else findItem(id).value = v;
  const it = findItem(id.replace(/-x$/, ''));
  const big = document.querySelector(`[data-hero="${it.id}"]`); if (big && !id.endsWith('-x')) big.innerHTML = heroValue(it);
  if (it.id === 'render') {
    const zone = document.querySelector('.render-map-svg .render-zone');
    if (zone) zone.style.transform = `scale(${v / 32})`;
    const lblR = document.querySelector('.render-map-svg .lbl-render');
    if (lblR) lblR.textContent = pluralChunks(v);
    const lblB = document.querySelector('.render-map-svg .lbl-blocks');
    if (lblB) lblB.textContent = `${v * 16} блоков`;
    const dh = !!(findItem('dh') && findItem('dh').value);
    const rawSim = findItem('sim') ? findItem('sim').value : 12;
    const effSim = Math.min(v, rawSim);
    const simR = Math.round(dh ? (effSim / 32 * 48) : (effSim / 32 * 63));
    const simRing = document.querySelector('.render-map-svg .sim-ring');
    if (simRing) simRing.setAttribute('r', simR);
    const simLbl = document.querySelector('.render-map-svg .sim-label');
    if (simLbl) simLbl.setAttribute('x', 365 + simR + 3);
  } else if (it.id === 'sim') {
    const dh = !!(findItem('dh') && findItem('dh').value);
    const rVal = findItem('render') ? findItem('render').value : 32;
    const effSim = Math.min(rVal, v);
    const simR = Math.round(dh ? (effSim / 32 * 48) : (effSim / 32 * 63));
    const simRing = document.querySelector('.render-map-svg .sim-ring');
    if (simRing) simRing.setAttribute('r', simR);
    const simLbl = document.querySelector('.render-map-svg .sim-label');
    if (simLbl) simLbl.setAttribute('x', 365 + simR + 3);
    const lblSim = document.querySelector('.render-map-svg .lbl-sim');
    if (lblSim) lblSim.textContent = pluralChunks(v);
  }
  const row = document.querySelector(`.row[data-item="${id}"] .val`); if (row) row.textContent = v + el.dataset.unit;
  document.querySelectorAll(`.chip[data-set="${id}"]`).forEach(c => c.classList.toggle('on', +c.dataset.v === v));
}

function startSliderDrag(s, clientX, pointerId) {
  drag = s;
  s.classList.add('drag');
  if (pointerId !== undefined && s.setPointerCapture) {
    try { s.setPointerCapture(pointerId); } catch (_) {}
  }
  const id = s.dataset.slider;
  if (!id.endsWith('-x')) {
    const it = findItem(id);
    if (it) s._oldValue = it.value;
  }
  console.log('[aura-ui CEF INPUT] startSliderDrag id=' + id + ' x=' + clientX + ' oldVal=' + s._oldValue);
  slideTo(s, clientX);
}

function stopSliderDrag(clientX) {
  if (drag) {
    const s = drag;
    s.classList.remove('drag');
    drag = null;
    if (clientX !== undefined) slideTo(s, clientX);
    const id = s.dataset.slider;
    if (!id.endsWith('-x')) {
      const it = findItem(id);
      console.log('[aura-ui CEF INPUT] stopSliderDrag id=' + id + ' val=' + (it ? it.value : 'null') + ' old=' + s._oldValue);
      if (it && s._oldValue !== undefined && s._oldValue !== it.value) {
        onSettingChanged(it.id, it.value, s._oldValue);
      }
    }
  }
}

function isEditableElement(el) {
  if (!el) return false;
  const tag = (el.tagName || '').toUpperCase();
  return tag === 'INPUT' || tag === 'TEXTAREA' || !!el.isContentEditable;
}

function notifyInputFocus(focused) {
  if (typeof window.cefQuery === 'function') {
    try {
      window.cefQuery({
        request: JSON.stringify({ op: 'input_focus', focused: focused }),
        onSuccess: () => {},
        onFailure: () => {}
      });
    } catch(err) {}
  }
}

document.addEventListener('focusin', e => {
  if (isEditableElement(e.target)) {
    notifyInputFocus(true);
  }
}, true);

document.addEventListener('focusout', e => {
  if (isEditableElement(e.target)) {
    setTimeout(() => {
      if (!isEditableElement(document.activeElement)) {
        notifyInputFocus(false);
      }
    }, 50);
  }
}, true);

// Если открыто автономно или не в игре, сразу делаем видимым
if (!INGAME || STANDALONE) {
  document.body.classList.add('opened');
}
if (qs.get('sec') && S[qs.get('sec')]) { state.section = qs.get('sec'); state.item = qs.get('item') || S[state.section].items[0].id; }
if (qs.get('theme')) { findItem('theme').value = qs.get('theme'); applyTheme(qs.get('theme')); }
if (qs.get('view')) setView(qs.get('view'));
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura — Главное меню</title>
<link rel="icon" href="data:,">
<script src="./lucide.min.js"></script>
<script>
(function() {
  const isHttp = location.protocol.startsWith('http');
  const fontUrl = isHttp ? '../v3/public/assets/fonts/Onest.woff2' : './fonts/Onest.woff2';
  const st = document.createElement('style');
  st.textContent = `@font-face { font-family: 'Onest'; src: url('${fontUrl}') format('woff2'); font-weight: 100 900; font-display: block; }`;
  document.head.appendChild(st);
})();
</script>
<style>
:root {
  --accent: #64D2FF;
  --accent-hover: #8EDEFF;
  --accent-ink: #00283A;
  --accent-soft: rgba(100, 210, 255, 0.18);
  --ink: #ffffff;
  --ink-2: rgba(255, 255, 255, 0.76);
  --ink-3: rgba(255, 255, 255, 0.56);
  --glass: rgba(30, 34, 44, 0.48);
  --glass-sheen: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04) 40%, rgba(255, 255, 255, 0.02));
  --glass-solid: rgba(28, 30, 38, 0.96);
  --line: rgba(255, 255, 255, 0.20);
  --hair: rgba(255, 255, 255, 0.10);
  --fill: rgba(118, 118, 128, 0.24);
  --fill-2: rgba(118, 118, 128, 0.36);
  --fill-3: rgba(118, 118, 128, 0.50);
  --danger: #FF8A8A;
  --spring: cubic-bezier(.34, 1.3, .5, 1);
  --smooth: cubic-bezier(.22, 1, .36, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.28); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.45); }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05070b;
  color: var(--ink);
  font-family: 'Onest', system-ui, -apple-system, sans-serif;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; outline: none; }
input { font: inherit; color: inherit; outline: none; }

/* 1. ФОН: ЧЕТКАЯ ПАНОРАМА / АРТ МИРА (БЕЗ РАЗМЫТИЯ) */
.scene-container {
  position: absolute;
  inset: -15px;
  overflow: hidden;
  opacity: 0;
  transition: opacity 0.6s ease, transform 1.2s var(--smooth);
  transform-origin: center center;
}
.scene-container.ready {
  opacity: 1;
}
.scene-container.launching {
  transform: scale(1.08);
}

.bg-viewport {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  transition: background-image 0.6s var(--smooth);
  transform: translate3d(0, 0, 0);
}

/* 3D панорама (CSS 3D Skybox куб) */
.skybox-viewport {
  position: absolute;
  inset: 0;
  perspective: 700px;
  perspective-origin: center center;
  display: none;
}
.skybox-viewport.active {
  display: block;
}
.skybox-cube {
  position: absolute;
  width: 1024px;
  height: 1024px;
  top: 50%;
  left: 50%;
  margin-top: -512px;
  margin-left: -512px;
  transform-style: preserve-3d;
  will-change: transform;
}
.skybox-face {
  position: absolute;
  width: 1024px;
  height: 1024px;
  background-size: 100% 100%;
  background-position: center;
  backface-visibility: hidden;
}
.skybox-face.front  { transform: rotateY(0deg) translateZ(-512px); }
.skybox-face.right  { transform: rotateY(-90deg) translateZ(-512px); }
.skybox-face.back   { transform: rotateY(180deg) translateZ(-512px); }
.skybox-face.left   { transform: rotateY(90deg) translateZ(-512px); }
.skybox-face.top    { transform: rotateX(-90deg) translateZ(-512px); }
.skybox-face.bottom { transform: rotateX(90deg) translateZ(-512px); }

/* Легкое затенение сверху и снизу для читаемости текста и острова (по эталону concepts-v5/island.html) */
.shade {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(4,8,14,.42) 0%, transparent 18%, transparent 62%, rgba(4,8,14,.62) 100%);
  z-index: 3;
}

/* Оверлей времени суток */
.time-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  transition: background-color 2s ease;
  background-color: transparent;
}
.time-overlay.morning { background-color: rgba(255, 180, 120, 0.08); }
.time-overlay.day     { background-color: rgba(0, 0, 0, 0); }
.time-overlay.evening { background-color: rgba(255, 120, 80, 0.10); }
.time-overlay.night   { background-color: rgba(40, 60, 140, 0.18); }

/* Логотип Aura слева вверху */
.brand {
  position: absolute;
  top: 26px;
  left: 34px;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-shadow: 0 2px 16px rgba(0,0,0,0.45);
  z-index: 10;
  color: #ffffff;
}

/* 2. ДРУЗЬЯ ОНЛАЙН (ПУЗЫРЬКИ НАД КАПСУЛОЙ) */
.friends-container {
  position: absolute;
  left: 50%;
  bottom: 118px;
  transform: translateX(-50%);
  display: none;
  align-items: center;
  gap: 10px;
  z-index: 25;
}
.friend-bubble {
  height: 36px;
  min-width: 36px;
  border-radius: 18px;
  background: var(--fill);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 6px 18px rgba(0, 0, 0, 0.25);
  display: flex;
  align-items: center;
  padding: 0 5px;
  cursor: pointer;
  overflow: hidden;
  transition: min-width 0.24s var(--spring), padding 0.24s var(--spring), background 0.2s ease;
}
.friend-bubble:hover {
  background: var(--fill-2);
  min-width: 170px;
  padding: 0 12px 0 6px;
}
.friend-bubble-avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  image-rendering: pixelated;
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
}
.friend-bubble-info {
  display: flex;
  flex-direction: column;
  margin-left: 8px;
  white-space: nowrap;
  opacity: 0;
  max-width: 0;
  overflow: hidden;
  transition: opacity 0.18s ease 0.06s, max-width 0.24s var(--spring);
}
.friend-bubble:hover .friend-bubble-info {
  opacity: 1;
  max-width: 140px;
}
.friend-bubble-name { font-size: 13px; font-weight: 600; color: #fff; line-height: 1.1; }
.friend-bubble-sub { font-size: 11px; color: var(--ink-3); line-height: 1.2; }

/* 3. КАПСУЛА «ОСТРОВ» ВНИЗУ ПО ЦЕНТРУ (ПО ЭТАЛОНУ concepts-v5/island.html) */
.island {
  position: absolute;
  left: 50%;
  bottom: 36px;
  transform: translateX(-50%);
  width: 420px;
  height: 72px;
  z-index: 20;
}

/* Наведение: расширение в панель навигации (760px) */
.island.nav-active {
  width: 760px;
}

/* Раскрытый раздел (миры): карточка-панель вверх */
.island.open {
  width: 640px;
  height: 490px;
  bottom: 32px;
}

/* Слои капсулы: анимация строго через transform и opacity (без покадрового reflow) */
.layer {
  position: absolute;
  inset: 0;
  border-radius: 36px;
  overflow: hidden;
  background: var(--glass-sheen), var(--glass);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.04), 0 20px 50px rgba(0, 0, 0, 0.40);
  opacity: 0;
  transform: scale(0.96);
  pointer-events: none;
  transition: opacity 0.22s var(--smooth), transform 0.26s var(--smooth);
}
#layerOpen {
  border-radius: 28px;
  transform: scale(0.96) translate3d(0, 10px, 0);
}
.layer.active {
  opacity: 1;
  transform: scale(1) translate3d(0, 0, 0);
  pointer-events: auto;
}

/* Горизонтальная строка капсулы (72px) */
.bar {
  display: flex;
  align-items: center;
  gap: 14px;
  height: 72px;
  padding: 0 12px 0 16px;
  white-space: nowrap;
}

/* Аватар игрока (круглая голова скина 44px) */
.face {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  flex-shrink: 0;
  image-rendering: pixelated;
  background-size: cover;
  background-position: center;
  background-color: var(--fill-2);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25), 0 4px 12px rgba(0, 0, 0, 0.3);
}

/* Мета капсулы покоя */
.meta {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  flex: 1;
  cursor: pointer;
}
.meta b {
  display: block;
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.small { font-size: 13px; }
.dim { color: var(--ink-3); }
.meta .small {
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Ряд кнопок навигации при hover */
.navrow {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: 4px;
  flex: 1;
}
.nav-btn {
  padding: 9px 14px;
  border-radius: 99px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
  transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
}
.nav-btn:hover {
  background: var(--fill-2);
  color: #ffffff;
  transform: translateY(-1px);
}
.nav-btn:active {
  transform: translateY(0);
}
.nav-btn.danger:hover {
  background: rgba(255, 138, 138, 0.22);
  color: var(--danger);
}

/* Кнопка «Играть» (Apple systemCyan капсула 52px) */
.play {
  margin-left: auto;
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 50px;
  min-width: 144px;
  padding: 0 24px;
  border-radius: 99px;
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
  font-size: 16px;
  flex-shrink: 0;
  box-shadow: 0 6px 24px rgba(100, 210, 255, 0.35);
  transition: transform 0.3s var(--spring), background 0.2s, box-shadow 0.2s;
}
.play:hover {
  transform: scale(1.03);
  background: var(--accent-hover);
  box-shadow: 0 8px 30px rgba(100, 210, 255, 0.45);
}
.play:active {
  transform: scale(0.97);
}
.play > span {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.tri {
  width: 0;
  height: 0;
  border-left: 11px solid currentColor;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}
.play .fill-progress {
  position: absolute;
  inset: 0;
  transform-origin: left;
  transform: scaleX(0);
  background: rgba(255, 255, 255, 0.40);
  transition: transform 0.4s ease;
}
.play.loading .fill-progress {
  transform: scaleX(0.75);
}

/* 4. РАСКРЫТЫЙ РАЗДЕЛ («МИРЫ») */
.sec {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 24px 28px 20px;
}
.sec-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}
.sec-head h2 {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.05;
}
.sec-head .sub {
  font-size: 14px;
  color: var(--ink-2);
  margin-top: 4px;
}
.close {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--fill);
  font-size: 16px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  transition: background 0.2s, transform 0.35s var(--spring);
}
.close:hover {
  background: var(--fill-3);
  transform: rotate(90deg);
}

.sec-body {
  flex: 1;
  overflow-y: auto;
  margin: 0 -28px;
  padding: 0 28px 12px;
}

/* Карточка последнего мира крупно */
.latest-world-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--line);
  margin-bottom: 18px;
  transition: background 0.2s;
}
.latest-world-card:hover {
  background: rgba(255, 255, 255, 0.10);
}
.latest-thumb {
  width: 58px;
  height: 58px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.08) center/cover;
  border: 1px solid rgba(255, 255, 255, 0.14);
  flex-shrink: 0;
}
.latest-info {
  flex: 1;
  min-width: 0;
}
.latest-name {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.latest-sub {
  font-size: 13px;
  color: var(--ink-3);
  margin-top: 3px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 40px;
  padding: 0 18px;
  border-radius: 99px;
  background: var(--fill-2);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  transition: background 0.2s, transform 0.2s;
}
.btn:hover { background: var(--fill-3); }
.btn:active { transform: scale(0.97); }
.btn.primary {
  background: var(--accent);
  color: var(--accent-ink);
}
.btn.primary:hover {
  background: var(--accent-hover);
}
.btn.sm {
  height: 36px;
  padding: 0 14px;
  font-size: 13px;
}

.group-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin: 14px 0 8px;
}

/* Список сохраненных миров */
.worlds-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.world-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  border-radius: 14px;
  cursor: pointer;
  transition: background 0.18s;
  border: 1px solid transparent;
}
.world-row:hover {
  background: rgba(255, 255, 255, 0.06);
}
.world-row.selected {
  background: rgba(255, 255, 255, 0.09);
  border-color: rgba(255, 255, 255, 0.12);
}
.world-row-thumb {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.08) center/cover;
  border: 1px solid rgba(255, 255, 255, 0.10);
  flex-shrink: 0;
}
.world-row-info {
  flex: 1;
  min-width: 0;
}
.world-row-name {
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.world-row-sub {
  font-size: 12px;
  color: var(--ink-3);
  margin-top: 2px;
}

/* Пустое состояние (без выдуманных данных) */
.empty-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  gap: 12px;
  color: var(--ink-2);
}
.empty-box h3 {
  font-size: 18px;
  font-weight: 600;
}
.empty-box p {
  font-size: 14px;
  color: var(--ink-3);
}

/* Тост */
.toast {
  position: absolute;
  left: 50%;
  top: 30px;
  transform: translate(-50%, -10px);
  padding: 10px 20px;
  border-radius: 99px;
  background: var(--glass-solid);
  border: 1px solid var(--line);
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s, transform 0.4s var(--spring);
  z-index: 50;
}
.toast.on {
  opacity: 1;
  transform: translate(-50%, 0);
}
</style>
</head>
<body>

<!-- 1. ФОН: Четкая панорама / арт мира (без размытия) -->
<div class="scene-container ready" id="sceneContainer">
  <div class="bg-viewport" id="bgViewport"></div>
  <div class="skybox-viewport" id="skyboxViewport">
    <div class="skybox-cube" id="skyboxCube">
      <div class="skybox-face front" id="skyFaceFront"></div>
      <div class="skybox-face right" id="skyFaceRight"></div>
      <div class="skybox-face back" id="skyFaceBack"></div>
      <div class="skybox-face left" id="skyFaceLeft"></div>
      <div class="skybox-face top" id="skyFaceTop"></div>
      <div class="skybox-face bottom" id="skyFaceBottom"></div>
    </div>
  </div>
</div>

<!-- Оверлей времени суток -->
<div class="time-overlay day" id="timeOverlay"></div>

<!-- Легкое затенение сверху и снизу для читаемости -->
<div class="shade"></div>

<!-- Логотип Aura слева вверху -->
<div class="brand">Aura</div>

<!-- Пузырьки друзей онлайн над капсулой (если есть) -->
<div class="friends-container" id="friendsContainer"></div>

<!-- КАПСУЛА «ОСТРОВ» ВНИЗУ ПО ЦЕНТРУ (ПО ЭТАЛОНУ concepts-v5/island.html) -->
<div class="island" id="island">

  <!-- Слой 1: Покой (idle) -->
  <div class="layer active" id="layerIdle">
    <div class="bar">
      <div class="face" id="idleAvatar"></div>
      <div class="meta" id="idleMeta" title="Нажмите для открытия миров">
        <b id="idleUserName">Игрок</b>
        <span class="small dim" id="idleWorldSub">Aura</span>
      </div>
      <button class="play" id="btnPlayIdle" title="Играть в последний мир">
        <div class="fill-progress" id="fillProgressIdle"></div>
        <span><span class="tri"></span><span id="playTextIdle">Играть</span></span>
      </button>
    </div>
  </div>

  <!-- Слой 2: Навигация (hover / nav) -->
  <div class="layer" id="layerNav">
    <div class="bar">
      <div class="face" id="navAvatar"></div>
      <nav class="navrow">
        <button class="nav-btn" data-action="worlds">Миры</button>
        <button class="nav-btn" data-action="servers">Серверы</button>
        <button class="nav-btn" data-action="friends">Друзья</button>
        <button class="nav-btn" data-action="settings">Настройки</button>
        <button class="nav-btn danger" data-action="quit">Выход</button>
      </nav>
      <button class="play" id="btnPlayNav" title="Играть в выбранный мир">
        <div class="fill-progress" id="fillProgressNav"></div>
        <span><span class="tri"></span><span id="playTextNav">Играть</span></span>
      </button>
    </div>
  </div>

  <!-- Слой 3: Раскрытый раздел «Миры» (open) -->
  <div class="layer" id="layerOpen">
    <div class="sec">
      <div class="sec-head">
        <div>
          <h2>Миры</h2>
          <div class="sub" id="worldsCountSub">Одиночная игра</div>
        </div>
        <button class="close" id="btnCloseWorlds" title="Закрыть">✕</button>
      </div>

      <div class="sec-body" id="secBody">
        <!-- Карточка последнего мира -->
        <div class="latest-world-card" id="latestWorldCard" style="display:none;">
          <div class="latest-thumb" id="latestThumb"></div>
          <div class="latest-info">
            <div class="latest-name" id="latestName">—</div>
            <div class="latest-sub" id="latestSub">—</div>
          </div>
          <button class="btn primary" id="btnPlayLatest">Играть</button>
        </div>

        <div class="group-title" id="allWorldsTitle" style="display:none;">Все сохранения</div>
        <div class="worlds-list" id="worldsList"></div>

        <!-- Пустое состояние если миров нет -->
        <div class="empty-box" id="emptyWorldsBox" style="display:none;">
          <h3>У вас пока нет сохранённых миров</h3>
          <p>Создайте новый мир, чтобы начать игру</p>
          <button class="btn primary" id="btnEmptyCreate">Создать новый мир</button>
        </div>

        <!-- Ошибка загрузки -->
        <div class="empty-box" id="errorWorldsBox" style="display:none;">
          <h3>Не удалось загрузить миры</h3>
          <p>Произошла ошибка при обращении к сохранениям</p>
          <button class="btn" id="btnRetryWorlds">Повторить</button>
        </div>

        <div style="margin-top: 14px; display: flex; justify-content: flex-end;" id="newWorldActionRow">
          <button class="btn sm" id="btnCreateNewWorld">+ Создать новый мир</button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Тост уведомлений -->
<div class="toast" id="toastPill"></div>

<script>
const INGAME = typeof window.cefQuery === 'function';
const URL_PARAMS = new URLSearchParams(location.search);

// Элементы интерфейса
const sceneContainer = document.getElementById('sceneContainer');
const bgViewport = document.getElementById('bgViewport');
const skyboxViewport = document.getElementById('skyboxViewport');
const skyboxCube = document.getElementById('skyboxCube');
const timeOverlay = document.getElementById('timeOverlay');
const friendsContainer = document.getElementById('friendsContainer');

const island = document.getElementById('island');
const layerIdle = document.getElementById('layerIdle');
const layerNav = document.getElementById('layerNav');
const layerOpen = document.getElementById('layerOpen');

const idleAvatar = document.getElementById('idleAvatar');
const navAvatar = document.getElementById('navAvatar');
const idleUserName = document.getElementById('idleUserName');
const idleWorldSub = document.getElementById('idleWorldSub');

const btnPlayIdle = document.getElementById('btnPlayIdle');
const btnPlayNav = document.getElementById('btnPlayNav');
const fillProgressIdle = document.getElementById('fillProgressIdle');
const fillProgressNav = document.getElementById('fillProgressNav');

const latestWorldCard = document.getElementById('latestWorldCard');
const latestThumb = document.getElementById('latestThumb');
const latestName = document.getElementById('latestName');
const latestSub = document.getElementById('latestSub');
const btnPlayLatest = document.getElementById('btnPlayLatest');

const allWorldsTitle = document.getElementById('allWorldsTitle');
const worldsList = document.getElementById('worldsList');
const worldsCountSub = document.getElementById('worldsCountSub');
const emptyWorldsBox = document.getElementById('emptyWorldsBox');
const errorWorldsBox = document.getElementById('errorWorldsBox');
const newWorldActionRow = document.getElementById('newWorldActionRow');

const btnCloseWorlds = document.getElementById('btnCloseWorlds');
const btnCreateNewWorld = document.getElementById('btnCreateNewWorld');
const btnEmptyCreate = document.getElementById('btnEmptyCreate');
const btnRetryWorlds = document.getElementById('btnRetryWorlds');
const toastPill = document.getElementById('toastPill');

// Состояние
let WORLDS = [];
let FRIENDS = [];
let selectedIndex = 0;
let isLaunching = false;
let isOpen = false;
let isNav = false;
let currentUser = 'Player';

// Отправка запросов в мост
function sendQuery(data, callback) {
  if (INGAME) {
    window.cefQuery({
      request: JSON.stringify(data),
      persistent: false,
      onSuccess: res => {
        try { callback && callback(JSON.parse(res)); }
        catch (e) { callback && callback(null); }
      },
      onFailure: (code, msg) => {
        callback && callback(null);
      }
    });
  } else {
    setTimeout(() => callback && callback(null), 10);
  }
}

function sendAction(name) {
  sendQuery({ op: 'action', name: name }, () => {});
}

function showToast(msg) {
  if (!toastPill) return;
  toastPill.textContent = msg;
  toastPill.classList.add('on');
  setTimeout(() => toastPill.classList.remove('on'), 2500);
}

// 1. ПАНОРАМА И ПАРАЛЛАКС
let baseYaw = 0;
let targetParallaxX = 0;
let currentParallaxX = 0;
let targetParallaxY = 0;
let currentParallaxY = 0;
let lastFrameTime = performance.now();
let hasPanoramaActive = false;

function tickPanorama(now) {
  const dt = Math.min(0.1, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  if (!document.hidden && !isLaunching) {
    if (hasPanoramaActive && skyboxCube) {
      baseYaw = (baseYaw + 0.6 * dt) % 360;
      currentParallaxX += (targetParallaxX - currentParallaxX) * 0.08;
      currentParallaxY += (targetParallaxY - currentParallaxY) * 0.08;
      const yaw = baseYaw + currentParallaxX;
      const pitch = currentParallaxY;
      skyboxCube.style.transform = `translateZ(512px) rotateX(${pitch.toFixed(2)}deg) rotateY(${yaw.toFixed(2)}deg)`;
    }
  }

  requestAnimationFrame(tickPanorama);
}
requestAnimationFrame(tickPanorama);

window.addEventListener('mousemove', (e) => {
  const nx = (e.clientX / window.innerWidth) * 2 - 1;
  const ny = (e.clientY / window.innerHeight) * 2 - 1;
  targetParallaxX = -nx * 1.5;
  targetParallaxY = ny * 1.5;
});

// 2. ВРЕМЯ СУТОК
function setTimeOfDay() {
  const h = new Date().getHours();
  let mode = 'day';
  if (h >= 6 && h < 11) mode = 'morning';
  else if (h >= 11 && h < 17) mode = 'day';
  else if (h >= 17 && h < 21) mode = 'evening';
  else mode = 'night';
  timeOverlay.className = 'time-overlay ' + mode;
}
setTimeOfDay();

// Аватар игрока
const DEFAULT_STEVE_HEAD = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAIAAAD8GO2jAAABPklEQVR4nGLx8PBgwAYUFRXh7L9//8LZzMzMWNXfv38fqzgTVlEqgqFvAQsyZ1Xddji7dmUBQc3fv3/HqjesyRPOHvpBRHMLGNPS0uAcTk5OONtPHpHeOTn44OzvXz8hdDMj3Lfp4W84++fPn3D20A8i+uYDV9F/cPbb94g0zsyMCN/3n97D2fLiYnC27q+7cPZZRlk4e+gHEe3jwE+OHc7xrp4EZwfbdcHZyXb34GzkcJ++RRzOXnuoF87mq0uHs4d+ENG+LJqT7AbniEvIwNks7AJw9uZ9+7BqDvGwgbOfPLoNZ997+RbOHvpBRPt88OU3os3z6wkiva86eArOdtcywKq5acY8ONvfzgTOZmRghbOHfhDRPg7uP38J5/z79x+rop3XLhA06Mt3RFz+/P0Lzh76QURzCwABAAD//7CsUdG2KoqpAAAAAElFTkSuQmCC";

function setPlayerHead(el, name) {
  if (!el) return;
  const safeName = (name && name.trim()) || 'Steve';
  const headUrl = `https://minotar.net/helm/${encodeURIComponent(safeName)}/44.png`;
  el.style.backgroundImage = `url('${headUrl}'), url('https://mc-heads.net/avatar/${encodeURIComponent(safeName)}/44'), url('${DEFAULT_STEVE_HEAD}')`;
}

// Форматирование режима и даты
function formatWorldMode(val) {
  if (!val) return 'Выживание';
  const low = String(val).toLowerCase();
  if (low.includes('creative') || low.includes('творчес')) return 'Творчество';
  if (low.includes('hardcore') || low.includes('хардкор')) return 'Хардкор';
  if (low.includes('adventure') || low.includes('приключ')) return 'Приключение';
  if (low.includes('spectator') || low.includes('наблюдат')) return 'Наблюдение';
  return 'Выживание';
}

function formatWorldDate(epochMs) {
  if (!epochMs) return '';
  const d = new Date(Number(epochMs));
  if (isNaN(d.getTime())) return String(epochMs);
  const now = new Date();
  const diffDays = Math.floor((now - d) / (1000 * 60 * 60 * 24));
  if (diffDays === 0) return 'сегодня';
  if (diffDays === 1) return 'вчера';
  if (diffDays < 7) return `${diffDays} дн. назад`;
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}

// 3. ОБНОВЛЕНИЕ ВЫБРАННОГО МИРА И ФОНА
function updateSelectedWorld() {
  if (!WORLDS.length) {
    idleWorldSub.textContent = 'Aura Pack';
    hasPanoramaActive = false;
    skyboxViewport.classList.remove('active');
    bgViewport.style.backgroundImage = "url('./textures/menu/bg_main.jpg')";
    return;
  }

  const w = WORLDS[selectedIndex];
  idleWorldSub.textContent = `${w.name} • ${w.mode}`;

  if (w.hasPanorama && w.panoramaFaces && w.panoramaFaces.length === 6) {
    hasPanoramaActive = true;
    skyboxViewport.classList.add('active');
    document.getElementById('skyFaceFront').style.backgroundImage = `url('${w.panoramaFaces[0]}')`;
    document.getElementById('skyFaceRight').style.backgroundImage = `url('${w.panoramaFaces[1]}')`;
    document.getElementById('skyFaceBack').style.backgroundImage = `url('${w.panoramaFaces[2]}')`;
    document.getElementById('skyFaceLeft').style.backgroundImage = `url('${w.panoramaFaces[3]}')`;
    document.getElementById('skyFaceTop').style.backgroundImage = `url('${w.panoramaFaces[4]}')`;
    document.getElementById('skyFaceBottom').style.backgroundImage = `url('${w.panoramaFaces[5]}')`;
  } else {
    hasPanoramaActive = false;
    skyboxViewport.classList.remove('active');
    const bgUrl = w.bg || './textures/menu/bg_main.jpg';
    bgViewport.style.backgroundImage = `url('${bgUrl}')`;
  }

  renderWorldsSection();
}

// Отрисовка раскрытого раздела «Миры»
function renderWorldsSection() {
  if (!WORLDS.length) {
    latestWorldCard.style.display = 'none';
    allWorldsTitle.style.display = 'none';
    worldsList.innerHTML = '';
    emptyWorldsBox.style.display = 'flex';
    errorWorldsBox.style.display = 'none';
    worldsCountSub.textContent = '0 сохранений';
    newWorldActionRow.style.display = 'none';
    return;
  }

  emptyWorldsBox.style.display = 'none';
  errorWorldsBox.style.display = 'none';
  newWorldActionRow.style.display = 'flex';
  worldsCountSub.textContent = `${WORLDS.length} ${WORLDS.length === 1 ? 'мир' : (WORLDS.length < 5 ? 'мира' : 'миров')}`;

  // Карточка последнего мира
  const latest = WORLDS[selectedIndex] || WORLDS[0];
  latestWorldCard.style.display = 'flex';
  latestName.textContent = latest.name;
  latestSub.textContent = `${latest.mode} • ${latest.date}`;
  latestThumb.style.backgroundImage = latest.icon ? `url('${latest.icon}')` : 'none';

  // Остальные миры
  const otherWorlds = WORLDS.filter((_, idx) => idx !== selectedIndex);
  if (otherWorlds.length > 0) {
    allWorldsTitle.style.display = 'block';
    worldsList.innerHTML = '';
    WORLDS.forEach((w, idx) => {
      if (idx === selectedIndex) return;
      const row = document.createElement('div');
      row.className = 'world-row';
      row.innerHTML = `
        <div class="world-row-thumb" style="${w.icon ? `background-image:url('${w.icon}')` : ''}"></div>
        <div class="world-row-info">
          <div class="world-row-name">${w.name}</div>
          <div class="world-row-sub">${w.mode} • ${w.date}</div>
        </div>
        <button class="btn sm">Выбрать</button>
      `;
      row.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedIndex = idx;
        updateSelectedWorld();
      });
      worldsList.appendChild(row);
    });
  } else {
    allWorldsTitle.style.display = 'none';
    worldsList.innerHTML = '';
  }
}

// 4. ЗАГРУЗКА ДАННЫХ ИЗ МОСТА (БЕЗ ДЕМО-ДАННЫХ)
function loadWorlds() {
  if (INGAME) {
    sendQuery({ op: 'worlds' }, res => {
      if (res && res.player) {
        currentUser = res.player;
        idleUserName.textContent = currentUser;
        setPlayerHead(idleAvatar, currentUser);
        setPlayerHead(navAvatar, currentUser);
      }

      if (res && Array.isArray(res.worlds)) {
        WORLDS = res.worlds.map(w => ({
          id: w.id || w.name,
          name: w.name,
          mode: formatWorldMode(w.mode),
          date: formatWorldDate(w.lastPlayed),
          icon: w.icon || '',
          bg: w.bg || './textures/menu/bg_main.jpg',
          hasPanorama: !!w.hasPanorama,
          panoramaFaces: w.panoramaFaces || null
        }));
        selectedIndex = 0;
        updateSelectedWorld();
      } else {
        WORLDS = [];
        updateSelectedWorld();
      }
    });
  } else {
    WORLDS = [];
    updateSelectedWorld();
    setPlayerHead(idleAvatar, 'Steve');
    setPlayerHead(navAvatar, 'Steve');
  }
}

// 5. СОСТОЯНИЯ КАПСУЛЫ (IDLE / NAV / OPEN)
function showState(state) {
  if (state === 'open') {
    isOpen = true;
    island.classList.add('open');
    island.classList.remove('nav-active');
    layerIdle.classList.remove('active');
    layerNav.classList.remove('active');
    layerOpen.classList.add('active');
  } else if (state === 'nav') {
    if (isOpen) return;
    isNav = true;
    island.classList.add('nav-active');
    island.classList.remove('open');
    layerIdle.classList.remove('active');
    layerNav.classList.add('active');
    layerOpen.classList.remove('active');
  } else {
    // idle
    if (isOpen) return;
    isNav = false;
    island.classList.remove('nav-active', 'open');
    layerIdle.classList.add('active');
    layerNav.classList.remove('active');
    layerOpen.classList.remove('active');
  }
}

// Слушатели наведения на остров
island.addEventListener('mouseenter', () => {
  if (!isOpen && !isLaunching) showState('nav');
});

island.addEventListener('mouseleave', () => {
  if (!isOpen && !isLaunching) showState('idle');
});

// Клик по мете в покое открывает раздел «Миры»
idleMeta.addEventListener('click', (e) => {
  e.stopPropagation();
  showState('open');
});

// Закрытие раскрытого раздела
btnCloseWorlds.addEventListener('click', (e) => {
  e.stopPropagation();
  isOpen = false;
  showState('idle');
});

// Клик вне острова схлопывает его
document.addEventListener('click', (e) => {
  if (isOpen && !island.contains(e.target)) {
    isOpen = false;
    showState('idle');
  }
});

// Обработка кнопок навигации
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const action = btn.dataset.action;
    if (action === 'worlds') {
      showState('open');
    } else if (action === 'servers') {
      sendAction('servers');
    } else if (action === 'friends') {
      showToast('Раздел друзей скоро будет доступен');
    } else if (action === 'settings') {
      sendAction('options');
    } else if (action === 'quit') {
      sendAction('quit');
    }
  });
});

// Создание нового мира
function triggerCreateWorld() {
  sendAction('create_world');
}
btnCreateNewWorld.addEventListener('click', triggerCreateWorld);
btnEmptyCreate.addEventListener('click', triggerCreateWorld);
btnRetryWorlds.addEventListener('click', loadWorlds);

// 6. ЗАПУСК ИГРЫ («ИГРАТЬ»)
function triggerPlay() {
  if (isLaunching) return;

  if (!WORLDS.length) {
    triggerCreateWorld();
    return;
  }

  isLaunching = true;
  isOpen = false;
  showState('idle');

  // Анимация кнопки
  btnPlayIdle.classList.add('loading');
  btnPlayNav.classList.add('loading');
  document.getElementById('playTextIdle').textContent = 'Запуск…';
  document.getElementById('playTextNav').textContent = 'Запуск…';

  // Плавное приближение сцены
  sceneContainer.classList.add('launching');

  const w = WORLDS[selectedIndex];
  if (INGAME) {
    setTimeout(() => {
      sendQuery({ op: 'play_world', id: w.id });
    }, 400);
  } else {
    showToast(`Запуск мира: ${w.name}`);
    setTimeout(() => {
      btnPlayIdle.classList.remove('loading');
      btnPlayNav.classList.remove('loading');
      document.getElementById('playTextIdle').textContent = 'Играть';
      document.getElementById('playTextNav').textContent = 'Играть';
      sceneContainer.classList.remove('launching');
      isLaunching = false;
    }, 2000);
  }
}

btnPlayIdle.addEventListener('click', (e) => {
  e.stopPropagation();
  triggerPlay();
});

btnPlayNav.addEventListener('click', (e) => {
  e.stopPropagation();
  triggerPlay();
});

btnPlayLatest.addEventListener('click', (e) => {
  e.stopPropagation();
  triggerPlay();
});

// Защита фокуса ввода
function isEditable(el) {
  if (!el) return false;
  const tag = (el.tagName || '').toLowerCase();
  return tag === 'input' || tag === 'textarea' || el.isContentEditable;
}
document.addEventListener('focusin', e => {
  if (isEditable(e.target)) sendQuery({ op: 'input_focus', focused: true });
}, true);
document.addEventListener('focusout', e => {
  if (isEditable(e.target)) {
    setTimeout(() => {
      if (!isEditable(document.activeElement)) sendQuery({ op: 'input_focus', focused: false });
    }, 50);
  }
}, true);

// Запуск инициализации
setPlayerHead(idleAvatar, 'Player');
setPlayerHead(navAvatar, 'Player');
loadWorlds();
</script>

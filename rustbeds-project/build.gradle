plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def targetMinecraft = providers.gradleProperty('targetMinecraft').getOrElse('1.20.1')
def targets = [
    '1.20.1': [yarn: '1.20.1+build.10', fabric: '0.92.2+1.20.1', java: 17, sources: 'mc120'],
    '1.21.1': [yarn: '1.21.1+build.3', fabric: '0.102.0+1.21.1', java: 21, sources: 'mc121']
]
if (!targets.containsKey(targetMinecraft)) {
    throw new GradleException("Unsupported Minecraft target: ${targetMinecraft}")
}
def target = targets[targetMinecraft]
layout.buildDirectory = file("build/${targetMinecraft}")

base {
    archivesName = "${project.archives_base_name}-mc${targetMinecraft}"
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${targetMinecraft}"
    mappings "net.fabricmc:yarn:${target.yarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabric}"
}

sourceSets {
    main.java.srcDir "src/${target.sources}/java"
    gametest {
        java.srcDirs = ['src/gametest/java', "src/gametest-${target.sources}/java"]
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        rustbeds { sourceSet sourceSets.main }
        rustbedsTest { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile.absolutePath}"
            runDir "../${targetMinecraft == '1.21.1' ? 'aura-ui-1.21' : 'aura-ui'}/run/rustbeds-qa"
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraftVersion", targetMinecraft
    inputs.property "javaVersion", target.java

    filesMatching("fabric.mod.json") {
        expand version: project.version, minecraftVersion: targetMinecraft, javaVersion: target.java
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = target.java
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(target.java)
    targetCompatibility = JavaVersion.toVersion(target.java)
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

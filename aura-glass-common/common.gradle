def commonDir = file("${project.projectDir}/../aura-glass-common")
sourceSets.main.java.srcDir "${commonDir}/src/main/java"
sourceSets.main.resources.srcDir "${commonDir}/src/main/resources"
sourceSets.test.java.srcDir "${commonDir}/src/test/java"
sourceSets.test.resources.srcDir "${commonDir}/src/test/resources"

tasks.register('runMusicClientTest', JavaExec) {
    dependsOn tasks.named('compileTestJava')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.auramc.glass.client.music.MusicClientTest'
}

tasks.register('runAutoCompleteTest', JavaExec) {
    dependsOn tasks.named('compileTestJava')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.auramc.glass.client.ui.AutoCompleteGlassTest'
}

tasks.register('runKaraokeTest', JavaExec) {
    dependsOn tasks.named('compileTestJava')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.auramc.glass.common.karaoke.KaraokeSuiteTest'
}

tasks.register('runMusicKaraokeIntegrationTest', JavaExec) {
    dependsOn tasks.named('compileTestJava')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.auramc.glass.client.karaoke.MusicKaraokeIntegrationTest'
}

tasks.register('runGlassInvariantsTest', JavaExec) {
    dependsOn tasks.named('compileTestJava')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.auramc.glass.common.render.GlassRenderInvariantsTest'
}

tasks.named('test') {
    dependsOn 'runMusicClientTest'
    dependsOn 'runAutoCompleteTest'
    dependsOn 'runKaraokeTest'
    dependsOn 'runMusicKaraokeIntegrationTest'
    dependsOn 'runGlassInvariantsTest'
}
